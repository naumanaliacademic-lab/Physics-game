            el('p.small.muted', { html: 'Area of the whole shape = ½·t₁·v + t₂·v + ½·t₃·v. Adjust and try again — attempts are free.' })
          ), [{ label: 'Adjust profile', primary: true }]);
          refresh();
        }
      }

      function nextLevel() {
        level++;
        if (level >= LEVELS.length) {
          run.award(marks, LEVELS.length);
          resolve();
          return;
        }
        buildControls();
      }

      function buildControls() {
        const L = LEVELS[level];
        panel.innerHTML = '';
        status = el('div.chips');
        sliders = {
          v:  UI.slider({ label: 'Cruise velocity v', min: 0, max: L.vCap, step: 0.5, value: Math.min(8, L.vCap), unit: 'm s⁻¹', onInput: refresh }),
          t1: UI.slider({ label: 'Speed-up time t₁', min: 0, max: 20, step: 0.5, value: 5, unit: 's', onInput: refresh }),
          t2: UI.slider({ label: 'Cruise time t₂',   min: 0, max: 30, step: 0.5, value: 5, unit: 's', onInput: refresh }),
          t3: UI.slider({ label: 'Slow-down time t₃', min: 0, max: 20, step: 0.5, value: 5, unit: 's', onInput: refresh })
        };
        panel.append(
          el('div.eyebrow', null, `Approach ${level + 1} of ${LEVELS.length}`),
          el('p.small', { html: `<strong>${L.note}</strong><br>Dock at <strong>${L.target} m</strong>. Hull limit <strong>${L.aMax} m s⁻²</strong>. Finish inside <strong>${L.tMax} s</strong>, at rest.` }),
          status,
          sliders.v.wrap, sliders.t1.wrap, sliders.t2.wrap, sliders.t3.wrap,
          launchBtn
        );
        refresh();
      }

      const launchBtn = el('button.btn.btn--primary.btn--wide', { type: 'button', onClick: launch }, '🚀 Fly this profile');
      buildControls();
    });
  }

  /** Velocity at time t on a piecewise-linear profile. */
  function velocityAt(a, t) {
    const pts = a.pts;
    for (let i = 1; i < pts.length; i++) {
      if (t <= pts[i].t) {
        const span = pts[i].t - pts[i - 1].t;
        if (span <= 0) return pts[i].v;
        const f = (t - pts[i - 1].t) / span;
        return pts[i - 1].v + (pts[i].v - pts[i - 1].v) * f;
      }
    }
    return pts[pts.length - 1].v;
  }

  /** The profile truncated at time t, so its area is the displacement so far. */
  function clipProfile(pts, t) {
    const out = [];
    for (let i = 0; i < pts.length; i++) {
      if (pts[i].t <= t) { out.push(pts[i]); continue; }
      const prev = pts[i - 1];
      if (!prev) break;
      const f = (t - prev.t) / (pts[i].t - prev.t);
      out.push({ t, v: prev.v + (pts[i].v - prev.v) * f });
      break;
    }
    if (out.length < 2) out.push({ t, v: pts[0].v });
    return out;
  }

  /* ------------------------------ task 2: telemetry ---------------------- */

  /** A three-phase graph whose last phase may dip below the axis. */
  function makeTelemetry() {
    const v1 = 2 * (2 + Math.floor(Math.random() * 6));        // 4–14
    const t1 = 2 + Math.floor(Math.random() * 4);              // 2–5
    const t2 = 2 + Math.floor(Math.random() * 6);              // 2–7
    const t3 = 2 + Math.floor(Math.random() * 4);
    const dipsBelow = Math.random() < 0.5;
    const v3 = dipsBelow ? -v1 / 2 : 0;
    const pts = [
      { t: 0, v: 0 },
      { t: t1, v: v1 },
      { t: t1 + t2, v: v1 },
      { t: t1 + t2 + t3, v: v3 }
    ];
    return { pts, v1, t1, t2, t3, v3 };
  }

  function telemetry(run) {
    return new Promise(resolve => {
      run.clear();
      run.setStep(1, 3);
      run.brief('Task 2 — <strong>Telemetry.</strong> This is the graph the ship actually flew. Read it: gradients give accelerations, areas give displacements. Watch for any part below the axis.');

      const T = makeTelemetry();
      const { cnv, ctx, w, h } = UI.canvas(540, 340);
      drawVT(ctx, w, h, T.pts, {});
      run.stage.append(el('div.canvas-wrap', null, cnv));

      const tEnd = T.pts[3].t;
      const s = Physics.areaUnder(T.pts);
      const d = Physics.distanceUnder(T.pts);
      const a1 = T.v1 / T.t1;
      const a3 = (T.v3 - T.v1) / T.t3;

      run.stage.append(el('div.panel.mt', null,
        el('div.eyebrow', null, 'Flight phases'),
        el('table.data', { html: `
          <tr><th>Phase</th><th>From</th><th>To</th><th>v at start</th><th>v at end</th></tr>
          <tr><td>1</td><td class="num">0 s</td><td class="num">${T.t1} s</td><td class="num">0</td><td class="num">${T.v1}</td></tr>
          <tr><td>2</td><td class="num">${T.t1} s</td><td class="num">${T.t1 + T.t2} s</td><td class="num">${T.v1}</td><td class="num">${T.v1}</td></tr>
          <tr><td>3</td><td class="num">${T.t1 + T.t2} s</td><td class="num">${tEnd} s</td><td class="num">${T.v1}</td><td class="num">${T.v3}</td></tr>` })
      ));

      const qs = [
        {
          type: 'num', badge: 'gradient',
          stem: 'Determine the <strong>acceleration in phase 1</strong>.',
          answer: a1, unit: 'm s⁻²', tol: 0.03,
          hint: 'Gradient = Δv / Δt.',
          work: `a = Δv/Δt = (${T.v1} − 0) / ${T.t1} = ${Physics.sig(a1, 3)} m s⁻²`
        },
        {
          type: 'num', badge: 'gradient',
          stem: 'Determine the <strong>acceleration in phase 3</strong>. Include the sign.',
          answer: a3, unit: 'm s⁻²', tol: 0.03, absTol: 0.05,
          work: `a = (${T.v3} − ${T.v1}) / ${T.t3} = ${Physics.sig(a3, 3)} m s⁻²\nNegative means "directed in the negative direction", not automatically "slowing".`
        },
        {
          type: 'num', badge: 'areahunter',
          stem: 'Determine the <strong>total displacement</strong> over the whole ' + tEnd + ' s.',
          answer: s, unit: 'm', tol: 0.03,
          hint: T.v3 < 0 ? 'Part of phase 3 is below the axis — that area is negative.' : 'Split it into a triangle, a rectangle and a triangle.',
          work: `Phase 1: ½ × ${T.t1} × ${T.v1} = ${Physics.sig(T.t1 * T.v1 / 2, 3)} m\n`
              + `Phase 2: ${T.t2} × ${T.v1} = ${Physics.sig(T.t2 * T.v1, 3)} m\n`
              + `Phase 3: ${Physics.sig(((T.v1 + T.v3) / 2) * T.t3, 3)} m${T.v3 < 0 ? '  (the part below the axis is negative)' : ''}\n`
              + `Total displacement = ${Physics.sig(s, 4)} m`
        },
        {
          type: 'num',
          stem: 'Determine the <strong>average velocity</strong> for the whole flight.',
          answer: s / tEnd, unit: 'm s⁻¹', tol: 0.04,
          work: `average velocity = total displacement ÷ total time = ${Physics.sig(s, 4)} ÷ ${tEnd} = ${Physics.sig(s / tEnd, 3)} m s⁻¹`
              + (T.v3 < 0 ? `\nNote the distance is ${Physics.sig(d, 4)} m, which is larger — areas below the axis add to the distance but subtract from the displacement.` : '')
        }
      ];

      Shell.askAll(run.side, qs, { title: 'Telemetry read-out', xp: 30 }).then(correct => {
        run.award(correct, qs.length);
        resolve();
      });
    });
  }

  /* ------------------------------ zone entry ----------------------------- */

  async function render(root) {
    const run = Shell.zone(root, META);
    await docking(run);
    await telemetry(run);

    run.clear();
    run.setStep(2, 3);
    run.brief('Task 3 — <strong>Flight check.</strong> The graph-reading traps that catch most candidates.');
    run.stage.append(el('div.panel', null,
      el('div.eyebrow', null, 'S2 key ideas'),
      el('ul.tight', { html: `
        <li>An s–t graph is <strong>not a picture of the path</strong>.</li>
        <li>Instantaneous velocity = gradient of the <strong>tangent</strong>.</li>
        <li>Area under v–t = displacement; below the axis it is negative.</li>
        <li>Area under a–t = <strong>Δv</strong>; add u to get v.</li>
        <li>A flat v–t line means constant velocity, not stopped.</li>` })
    ));

    const qs = Questions.sample(Questions.banks.s2, 4);
    const correct = await Shell.askAll(run.side, qs, { title: 'Licence check', xp: 30 });
    run.award(correct, qs.length);
    run.setStep(3, 3);
    await run.finish();
  }

  return { META, render, drawVT };
})();

</script>
<script>
/* ==========================================================================
   zone3.js — S3 Equations of motion: "Reactor Core"
   Task 1  Equation select — list s,u,v,a,t; the quantity you neither have nor
           want tells you which of the four booklet equations to fire.
   Task 2  Capsule catch  — free fall with a sign convention, under a clock.
   Task 3  Flight check.
   ========================================================================== */

const Zone3 = (() => {
  'use strict';
  const el = UI.el;
  const ACCENT = '#ffc24a';
  const G = Physics.G;

  const META = {
    id: 'z3',
    tag: 'Zone 3 · S3',
    name: 'Reactor Core',
    subtitle: 'The four equations of motion, sign conventions and free fall',
    accent: ACCENT,
    steps: 3,
    praise: 'Core stable. You pick the right equation before you touch the calculator.',
    revise: 'Re-read S3 steps 4–6: list s, u, v, a, t, find the quantity that is missing, and pick the equation without it.',
    recap: [
      'The equations apply to <strong>uniform acceleration</strong> along a straight line only.',
      'Missing t → v² = u² + 2as.  Missing s → v = u + at.  Missing v → s = ut + ½at².  Missing a → s = ((u+v)/2)t.',
      'State a positive direction and keep it: with up positive, a = −9.81 m s⁻² for the whole flight.',
      'At the highest point v = 0 but a is still g downwards.'
    ]
  };

  /* The four equations exactly as the data booklet prints them (page 6). */
  const EQUATIONS = [
    { id: 'noA', text: 's = ((u + v)/2) t', missing: 'a' },
    { id: 'noS', text: 'v = u + at',        missing: 's' },
    { id: 'noV', text: 's = ut + ½at²',     missing: 'v' },
    { id: 'noT', text: 'v² = u² + 2as',     missing: 't' }
  ];

  const SYMBOL = {
    s: { name: 'displacement', unit: 'm' },
    u: { name: 'initial velocity', unit: 'm s⁻¹' },
    v: { name: 'final velocity', unit: 'm s⁻¹' },
    a: { name: 'acceleration', unit: 'm s⁻²' },
    t: { name: 'time', unit: 's' }
  };

  const SCENARIOS = [
    { text: 'A rescue shuttle accelerates uniformly along a straight launch rail.', sign: 'Forward is positive.' },
    { text: 'A supply pod fires its retro-thrusters and slows uniformly on a straight approach.', sign: 'Direction of travel is positive.', braking: true },
    { text: 'A maglev sled accelerates uniformly down a straight track.', sign: 'Forward is positive.' },
    { text: 'A survey rover brakes uniformly to a stop on a straight run.', sign: 'Direction of travel is positive.', braking: true }
  ];

  /** Build a fully consistent s, u, v, a, t set, then hide one and ask for another. */
  function makeProblem() {
    for (let attempt = 0; attempt < 80; attempt++) {
      const scenario = Questions.pick(SCENARIOS);
      const t = 2 + Math.floor(Math.random() * 9);                        // 2–10 s
      let u, a;
      if (scenario.braking) {
        u = 8 + Math.floor(Math.random() * 20);                           // 8–27
        a = -(u / t) * (Math.random() < 0.5 ? 1 : 0.6);                   // stops, or slows a lot
      } else {
        u = Math.random() < 0.4 ? 0 : 2 + Math.floor(Math.random() * 12);
        a = 0.5 + Math.floor(Math.random() * 8) * 0.5;                    // 0.5–4.0
      }
      a = Math.round(a * 4) / 4;
      const v = Physics.suvat.vFromUAt(u, a, t);
      const s = Physics.suvat.sFromUAt(u, a, t);
      if (v < 0 || s <= 1) continue;                                      // keep it physical and readable

      // Hide one quantity; ask for another; the other three are given.
      const order = ['s', 'v', 'a', 't'];
      const missing = Questions.pick(order);
      const target = Questions.pick(order.filter(k => k !== missing));
      const values = { s, u, v, a, t };
      const given = ['u', ...order.filter(k => k !== missing && k !== target)];
      if (given.some(k => !isFinite(values[k]))) continue;

      return { scenario, values, missing, target, given, equation: EQUATIONS.find(e => e.missing === missing) };
    }
    // Deterministic fallback: the specimen-paper car from slide 81.
    return {
      scenario: { text: 'A car decelerates uniformly until it stops.', sign: 'Direction of travel is positive.' },
      values: { s: 32, u: 16, v: 0, a: -4, t: 4 },
      missing: 't', target: 's', given: ['u', 'v', 'a'],
      equation: EQUATIONS.find(e => e.missing === 't')
    };
  }

  function dataTable(problem) {
    const rows = ['s', 'u', 'v', 'a', 't'].map(k => {
      const known = problem.given.includes(k);
      const wanted = k === problem.target;
      const value = known ? `${Physics.sig(problem.values[k], 3)} ${SYMBOL[k].unit}` : (wanted ? '= ?' : 'not given');
      const style = wanted ? 'color:#ffc24a;font-weight:700' : (known ? '' : 'color:#5f7190');
      return `<tr><td class="num" style="${style}">${k}</td><td style="${style}">${SYMBOL[k].name}</td><td class="num" style="${style}">${value}</td></tr>`;
    }).join('');
    return el('table.data', { html: `<tr><th>Symbol</th><th>Quantity</th><th>Value</th></tr>${rows}` });
  }

  /* ------------------------------ task 1 --------------------------------- */

  function equationSelect(run) {
    return new Promise(resolve => {
      run.clear();
      run.setStep(0, 3);
      run.brief('Task 1 — <strong>Equation select.</strong> Three of the five quantities are on the console and one is wanted. The fifth — the one you neither have nor want — tells you which equation to fire.');

      const ROUNDS = 3;
      let round = 0, marks = 0;
      const MAX = ROUNDS * 2;

      function nextRound() {
        if (round >= ROUNDS) { run.award(marks, MAX); resolve(); return; }
        const p = makeProblem();
        run.clear();

        run.stage.append(el('div.panel', null,
          el('div.eyebrow', null, `Core cycle ${round + 1} of ${ROUNDS}`),
          el('p', { html: `<strong>${p.scenario.text}</strong> ${p.scenario.sign}` }),
          dataTable(p),
          el('p.small.muted.mt.mb0', { html: `Find the <strong>${SYMBOL[p.target].name}</strong>. Notice which row says <em>not given</em>.` })
        ));

        const slot = el('div');
        run.side.append(el('div.panel', null, el('div.eyebrow', null, 'Step 1 — choose the equation'), slot));

        const options = EQUATIONS.map(eq => ({
          text: `<code>${eq.text}</code>`,
          why: `This one contains <strong>${eq.missing}</strong>, which is not given here.`
        }));
        const answerIndex = EQUATIONS.findIndex(e => e.id === p.equation.id);
        options[answerIndex].why = undefined;

        UI.ask(slot, {
          type: 'mcq',
          badge: 'chooser',
          stem: `Which equation gets you to <strong>${p.target}</strong> in one step?`,
          options,
          answer: answerIndex,
          work: `${p.missing} is the quantity you neither have nor want, so choose the equation without ${p.missing}:\n${p.equation.text}`
        }, ({ correct }) => {
          if (correct) { marks++; Game.addXp(30); }
          askValue(p);
        });
      }

      function askValue(p) {
        const slot = el('div');
        run.side.append(el('div.panel', null, el('div.eyebrow', null, 'Step 2 — get the number'), slot));
        const answer = p.values[p.target];
        UI.ask(slot, {
          type: 'num',
          stem: `Now calculate <strong>${p.target}</strong>, the ${SYMBOL[p.target].name}.`,
          answer, unit: SYMBOL[p.target].unit, tol: 0.03, absTol: 0.02,
          hint: `Substitute into ${p.equation.text} — signs included.`,
          work: workingFor(p)
        }, ({ correct }) => {
          if (correct) { marks++; Game.addXp(35); }
          round++;
          setTimeout(nextRound, 250);
        });
      }

      function workingFor(p) {
        const V = p.values;
        const n = k => Physics.sig(V[k], 3);
        const lines = [`Using ${p.equation.text}:`];
        switch (p.equation.id) {
          case 'noT': lines.push(`${n('v')}² = ${n('u')}² + 2(${n('a')})(${n('s')})`); break;
          case 'noS': lines.push(`${n('v')} = ${n('u')} + (${n('a')})(${n('t')})`); break;
          case 'noV': lines.push(`${n('s')} = (${n('u')})(${n('t')}) + ½(${n('a')})(${n('t')})²`); break;
          case 'noA': lines.push(`${n('s')} = ((${n('u')} + ${n('v')})/2)(${n('t')})`); break;
        }
        lines.push(`→ ${p.target} = ${Physics.sig(V[p.target], 3)} ${SYMBOL[p.target].unit}`);
        return lines.join('\n');
      }

      nextRound();
    });
  }

  /* ------------------------------ task 2: capsule catch ------------------ */

  /**
   * A supply capsule is launched straight up from a platform.  The cadet must
   * work out WHEN it will pass a catch net on the way down, then arm the net.
   * Up is positive; a = −g for the whole flight, including at the top.
   */
  function capsuleCatch(run) {
    return new Promise(resolve => {
      run.clear();
      run.setStep(1, 3);
      run.brief('Task 2 — <strong>Capsule catch.</strong> Take <strong>up as positive</strong>, so a = −9.81 m s⁻² for the whole flight. Work out the answer on paper, arm the net, and watch the capsule prove you right.');

      const ROUNDS = 3;
      let round = 0, marks = 0;

      function makeDrop() {
        const u = 12 + Math.floor(Math.random() * 14);        // 12–25 m s⁻¹ up
        const launchHeight = 0;
        const apex = (u * u) / (2 * G);
        // Net somewhere between a third and three-quarters of the way up.
        const netHeight = Math.round((apex * (0.35 + Math.random() * 0.4)) * 2) / 2;
        // Times when the capsule is at netHeight: up first, then down.
        const disc = Math.sqrt(u * u - 2 * G * netHeight);
        const tUp = (u - disc) / G;
        const tDown = (u + disc) / G;
        return { u, launchHeight, apex, netHeight, tUp, tDown, tApex: u / G, total: (2 * u) / G };
      }

      function nextRound() {
        if (round >= ROUNDS) { run.award(marks, ROUNDS * 2); resolve(); return; }
        const D = makeDrop();
        run.clear();

        const { cnv, ctx, w, h } = UI.canvas(400, 420);
        run.stage.append(el('div.canvas-wrap', null, cnv));
        const readouts = UI.readout({
          t: { label: 'clock' }, y: { label: 'height' }, v: { label: 'velocity' }, a: { label: 'acceleration', value: '−9.81 m s⁻²' }
        });
        run.stage.append(readouts.wrap);

        let simT = 0, running = false, armedAt = null, caught = false;
        const topOfScale = D.apex * 1.18;

        function draw() {
          ctx.clearRect(0, 0, w, h);
          ctx.fillStyle = '#050a12'; ctx.fillRect(0, 0, w, h);
          const groundY = h - 40;
          const Y = metres => groundY - (metres / topOfScale) * (groundY - 30);

          // Platform and height scale
          ctx.strokeStyle = '#24344f'; ctx.lineWidth = 1;
          ctx.fillStyle = '#5f7190'; ctx.font = '11px ui-monospace, monospace';
          for (let m = 0; m <= topOfScale; m += 5) {
            ctx.beginPath(); ctx.moveTo(52, Y(m)); ctx.lineTo(w - 14, Y(m)); ctx.stroke();
            ctx.fillText(`${m} m`, 10, Y(m) + 4);
          }
          ctx.fillStyle = '#16233b';
          ctx.fillRect(52, groundY, w - 66, 40);

          // Catch net
          ctx.strokeStyle = armedAt !== null ? '#5ce08a' : ACCENT;
          ctx.lineWidth = 3;
          ctx.setLineDash(armedAt !== null ? [] : [6, 5]);
          ctx.beginPath(); ctx.moveTo(w / 2 - 44, Y(D.netHeight)); ctx.lineTo(w / 2 + 44, Y(D.netHeight)); ctx.stroke();
          ctx.setLineDash([]);
          ctx.fillStyle = armedAt !== null ? '#5ce08a' : ACCENT;
          ctx.font = '700 11px ui-monospace, monospace';
          ctx.fillText(`NET  ${D.netHeight} m`, w / 2 + 50, Y(D.netHeight) + 4);

          // Capsule
          const y = D.u * simT - 0.5 * G * simT * simT;
          const v = D.u - G * simT;
          const cy = Y(Math.max(0, y));
          ctx.fillStyle = caught ? '#5ce08a' : '#e8eef8';
          ctx.beginPath(); ctx.arc(w / 2, cy, 9, 0, Math.PI * 2); ctx.fill();
          // Velocity arrow: shows v reversing while a never does.
          if (running && !caught) {
            ctx.strokeStyle = '#2fd6c3'; ctx.lineWidth = 3;
            ctx.beginPath(); ctx.moveTo(w / 2, cy); ctx.lineTo(w / 2, cy - v * 2.2); ctx.stroke();
          }

          readouts.set('t', `${Physics.fix(simT, 2)} s`);
          readouts.set('y', `${Physics.fix(Math.max(0, y), 1)} m`);
          readouts.set('v', `${Physics.fix(v, 1)} m s⁻¹`);
        }

        draw();

        const qPanel = el('div.panel');
        run.side.append(qPanel);

        // Step 1: the apex — the classic "v = 0 but a = g" check.
        const apexSlot = el('div');
        qPanel.append(el('div.eyebrow', null, `Catch ${round + 1} of ${ROUNDS} — step 1`), apexSlot);
        UI.ask(apexSlot, {
          type: 'num',
          badge: 'topofflight',
          stem: `The capsule leaves the platform at <strong>${D.u} m s⁻¹ upwards</strong>. Calculate its <strong>maximum height</strong> above the platform.`,
          answer: D.apex, unit: 'm', tol: 0.03,
          hint: 'At the top v = 0. No time is given, so which equation has no t?',
          work: `v² = u² + 2as with v = 0, a = −9.81:\n0 = ${D.u}² + 2(−9.81)s\ns = ${D.u * D.u} / 19.62 = ${Physics.sig(D.apex, 3)} m\nAt that instant v = 0 but a is still 9.81 m s⁻² downwards.`
        }, ({ correct }) => {
          if (correct) { marks++; Game.addXp(35); }
          askNetTime();
        });

        function askNetTime() {
          const slot = el('div');
          qPanel.append(el('div.eyebrow.mt', null, 'Step 2 — arm the net'), slot);
          UI.ask(slot, {
            type: 'num',
            stem: `The net sits at <strong>${D.netHeight} m</strong>. At what time after launch does the capsule pass it <strong>on the way down</strong>?`,
            answer: D.tDown, unit: 's', tol: 0.03, absTol: 0.03,
            hint: 'Use s = ut + ½at² with s = the net height. Two roots: the larger one is the way down.',
            work: `${D.netHeight} = ${D.u}t − 4.905t²\n4.905t² − ${D.u}t + ${D.netHeight} = 0\nt = ${Physics.sig(D.tUp, 3)} s (going up) or t = ${Physics.sig(D.tDown, 3)} s (coming down)\nThe net is armed for the larger root.`
          }, ({ correct }) => {
            if (correct) { marks++; Game.addXp(45); }
            armedAt = D.tDown;
            runCatch();
          });
        }

        function runCatch() {
          running = true;
          const btn = el('button.btn.btn--primary.btn--wide.mt', { type: 'button', disabled: true }, 'Launching…');
          qPanel.append(btn);
          const anim = Zone.loop(dt => {
            simT += dt * 0.9;
            const y = D.u * simT - 0.5 * G * simT * simT;
            if (armedAt !== null && simT >= armedAt && !caught) {
              caught = true;
              simT = armedAt;
              anim.stop();
              draw();
              btn.disabled = false;
              btn.textContent = round < ROUNDS - 1 ? 'Next catch ▶' : 'Finish task ▶';
              btn.onclick = () => { round++; nextRound(); };
              UI.toast('Capsule caught ✓', 1800);
              return;
            }
            if (y < 0) { anim.stop(); }
            draw();
          });
        }
      }

      nextRound();
    });
  }

  /* ------------------------------ zone entry ----------------------------- */

  async function render(root) {
    const run = Shell.zone(root, META);
    await equationSelect(run);
    await capsuleCatch(run);

    run.clear();
    run.setStep(2, 3);
    run.brief('Task 3 — <strong>Flight check.</strong>');
    run.stage.append(el('div.panel', null,
      el('div.eyebrow', null, 'Data booklet, page 6'),
      el('table.data', { html: `
        <tr><th>Equation</th><th>Leaves out</th></tr>
        <tr><td class="num">s = ((u + v)/2) t</td><td class="num">a</td></tr>
        <tr><td class="num">v = u + at</td><td class="num">s</td></tr>
        <tr><td class="num">s = ut + ½at²</td><td class="num">v</td></tr>
        <tr><td class="num">v² = u² + 2as</td><td class="num">t</td></tr>` }),
      el('p.small.muted.mt.mb0', { html: 'The booklet gives magnitudes only — <strong>you</strong> supply the signs.' })
    ));

    const qs = Questions.sample(Questions.banks.s3, 4);
    const correct = await Shell.askAll(run.side, qs, { title: 'Licence check', xp: 30 });
    run.award(correct, qs.length);
    run.setStep(3, 3);
    await run.finish();
  }

  return { META, render };
})();

</script>
<script>
/* ==========================================================================
   zone4.js — S4 Projectile motion: "Launch Bay"
   A rescue-line launcher. Horizontal and vertical motion are independent, so
   level 1 fires a line AND drops a marker at the same instant: they hit the
   water together, which is the Shoot-n-Drop demonstration from the deck.
   Task 1  Four launches — horizontal, above, below the horizontal, and over a wall.
   Task 2  Flight check.
   ========================================================================== */

const Zone4 = (() => {
  'use strict';
  const el = UI.el;
  const ACCENT = '#5ce08a';
  const G = Physics.G;

  const META = {
    id: 'z4',
    tag: 'Zone 4 · S4',
    name: 'Launch Bay',
    subtitle: 'Projectiles: two columns, one clock',
    accent: ACCENT,
    steps: 2,
    praise: 'Every line on target. Resolve, two columns, time from the vertical.',
    revise: 'Re-read S4 steps 4–7: resolve the launch velocity, write a horizontal and a vertical column, and let the time link them.',
    recap: [
      'a<sub>x</sub> = 0 so v<sub>x</sub> is constant; a<sub>y</sub> = g downwards the whole flight.',
      'Time is the only quantity the two columns share — usually find it from the vertical.',
      'At the top v<sub>y</sub> = 0 but v = v<sub>x</sub>, and a is still g downwards.',
      '45° gives the greatest range only on level ground with no air resistance.'
    ]
  };

  /* ------------------------------ levels --------------------------------- */

  const LEVELS = [
    {
      name: 'Line to the raft',
      brief: 'A raft is adrift below the cliff. Fire the rescue line <strong>horizontally</strong> from the cliff edge so it lands on the raft. A marker is released from your hand at the same instant — watch when it lands.',
      height: 30, angle: 0, angleLocked: true,
      speedRange: [4, 30], targetX: null, tol: 2.2,
      showDrop: true,
      question: s => ({
        type: 'num', badge: 'independence',
        stem: `The line was fired horizontally at <strong>${Physics.sig(s.u, 3)} m s⁻¹</strong> from <strong>${s.h} m</strong> up. Calculate the <strong>time of flight</strong>.`,
        answer: s.flight.timeOfFlight, unit: 's', tol: 0.04,
        hint: 'Use the vertical column only. u_y = 0.',
        work: `Vertical (down positive): ${s.h} = ½ × 9.81 × t²\nt = √(${(2 * s.h).toFixed(1)} / 9.81) = ${Physics.sig(s.flight.timeOfFlight, 3)} s\n`
            + `The marker, dropped from rest, takes exactly the same time — the horizontal speed changes nothing.`
      })
    },
    {
      name: 'Over the ridge',
      brief: 'A stranded team is on flat ground across the valley. Launch <strong>above the horizontal</strong> from ground level and land the pack on their marker.',
      height: 0, angle: 40, angleLocked: false, angleRange: [10, 80],
      speedRange: [8, 35], targetX: null, tol: 2.5,
      question: s => ({
        type: 'num',
        stem: `You launched at <strong>${Physics.sig(s.u, 3)} m s⁻¹</strong>, <strong>${s.angle}°</strong> above the horizontal. Calculate the <strong>maximum height</strong> reached.`,
        answer: s.flight.maxHeight, unit: 'm', tol: 0.05,
        hint: 'Resolve u_y = u sin θ, then use v_y = 0 at the top.',
        work: `u_y = ${Physics.sig(s.u, 3)} sin ${s.angle}° = ${Physics.sig(s.flight.uy, 3)} m s⁻¹\n`
            + `0 = u_y² − 2gH  →  H = ${Physics.sig(s.flight.uy, 3)}² / 19.62 = ${Physics.sig(s.flight.maxHeight, 3)} m`
      })
    },
    {
      name: 'Down to the deck',
      brief: 'The pad is at the foot of the tower. Launch <strong>below the horizontal</strong> — the vertical motion now starts with a downward component, so the time needs the quadratic formula.',
      height: 25, angle: -20, angleLocked: false, angleRange: [-55, -5],
      speedRange: [6, 28], targetX: null, tol: 2.2,
      question: s => ({
        type: 'num',
        stem: `Launched at <strong>${Physics.sig(s.u, 3)} m s⁻¹</strong>, <strong>${Math.abs(s.angle)}° below</strong> the horizontal, from <strong>${s.h} m</strong> up. Calculate the <strong>speed on landing</strong>.`,
        answer: s.flight.landingSpeed, unit: 'm s⁻¹', tol: 0.05,
        hint: 'Find v_y at landing, then recombine: v = √(v_x² + v_y²).',
        work: `v_x = ${Physics.sig(s.flight.ux, 3)} m s⁻¹ (constant)\n`
            + `v_y at landing = ${Physics.sig(Math.abs(s.flight.uy) + G * s.flight.timeOfFlight, 3)} m s⁻¹ downwards\n`
            + `v = √(v_x² + v_y²) = ${Physics.sig(s.flight.landingSpeed, 3)} m s⁻¹, at ${Physics.sig(Math.abs(s.flight.landingAngle), 2)}° below the horizontal`
      })
    },
    {
      name: 'Clear the mast',
      brief: 'A mast stands between you and the landing zone. The pack must pass <strong>over</strong> the mast and still land on the marker. Two conditions, one launch.',
      height: 0, angle: 55, angleLocked: false, angleRange: [20, 80],
      speedRange: [10, 40], targetX: null, tol: 3.0,
      obstacle: true,
      question: s => ({
        type: 'mcq', badge: 'topofflight',
        stem: 'At the highest point of that flight, what was the pack doing?',
        options: [
          { text: `Moving at ${Physics.sig(s.flight.ux, 2)} m s⁻¹ horizontally, accelerating at 9.81 m s⁻² downwards` },
          { text: 'Momentarily at rest, with zero acceleration', why: 'Only v<sub>y</sub> is zero. The horizontal velocity never changed, and gravity never switched off.' },
          { text: `Moving at ${Physics.sig(s.u, 2)} m s⁻¹ horizontally`, why: 'That is the full launch speed. At the top only the horizontal component remains: u cos θ.' },
          { text: 'Momentarily at rest, accelerating at 9.81 m s⁻² downwards', why: 'v<sub>y</sub> = 0, but v<sub>x</sub> = u cos θ is unchanged, so the pack is still moving.' }
        ],
        answer: 0,
        work: `v_x = u cos θ = ${Physics.sig(s.u, 3)} cos ${s.angle}° = ${Physics.sig(s.flight.ux, 3)} m s⁻¹, constant all flight.\n`
            + `At the top v_y = 0, so v = v_x. The acceleration is g downwards everywhere.`
      })
    }
  ];

  /** Choose a target the player can actually reach with the sliders given. */
  function placeTarget(level) {
    const [sMin, sMax] = level.speedRange;
    const angle = level.angleLocked ? level.angle : (level.angleRange[0] + level.angleRange[1]) / 2;
    const near = Physics.projectile(sMin * 1.25, angle, level.height).range;
    const far = Physics.projectile(sMax * 0.85, angle, level.height).range;
    const lo = Math.min(near, far), hi = Math.max(near, far);
    const x = lo + Math.random() * (hi - lo);
    return Math.max(6, Math.round(x * 2) / 2);
  }

  /* ------------------------------ rendering ------------------------------ */

  function makeView(level, targetX, obstacle) {
    const maxX = Math.max(targetX * 1.25, 30);
    const maxY = Math.max(level.height + 20, 30);
    return { maxX, maxY };
  }

  function drawScene(ctx, w, h, opts) {
    const { level, targetX, view, path, marker, projectilePos, dropPos, strobe, obstacle } = opts;
    const pad = { l: 34, r: 18, t: 18, b: 34 };
    const X = mx => pad.l + (mx / view.maxX) * (w - pad.l - pad.r);
    const Y = my => h - pad.b - (my / view.maxY) * (h - pad.t - pad.b);

    ctx.clearRect(0, 0, w, h);
    const sky = ctx.createLinearGradient(0, 0, 0, h);
    sky.addColorStop(0, '#0a1424');
    sky.addColorStop(1, '#050a12');
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, w, h);

    // Distance scale along the ground
    ctx.strokeStyle = 'rgba(36,52,79,.8)';
    ctx.fillStyle = '#5f7190';
    ctx.font = '10px ui-monospace, monospace';
    ctx.lineWidth = 1;
    const step = view.maxX > 120 ? 20 : view.maxX > 60 ? 10 : 5;
    const yStep = view.maxY > 120 ? 20 : view.maxY > 60 ? 10 : 5;
    for (let m = 0; m <= view.maxX; m += step) {
      ctx.beginPath(); ctx.moveTo(X(m), pad.t); ctx.lineTo(X(m), Y(0)); ctx.stroke();
    }
    for (let m = 0; m <= view.maxY; m += yStep) {
      ctx.beginPath(); ctx.moveTo(pad.l, Y(m)); ctx.lineTo(w - pad.r, Y(m)); ctx.stroke();
    }

    // Ground and the launch platform
    ctx.fillStyle = '#16233b';
    ctx.fillRect(pad.l, Y(0), w - pad.l - pad.r, h - pad.b - Y(0) + 20);
    if (level.height > 0) {
      ctx.fillStyle = '#1d2c48';
      ctx.fillRect(pad.l, Y(level.height), X(4) - pad.l, Y(0) - Y(level.height));
    }

    // Scale labels go on last, so the ground fill cannot bury them.
    ctx.fillStyle = '#5f7190';
    ctx.font = '10px ui-monospace, monospace';
    for (let m = 0; m <= view.maxX; m += step) ctx.fillText(`${m}`, X(m) - 5, h - pad.b + 14);
    for (let m = yStep; m <= view.maxY; m += yStep) ctx.fillText(`${m}`, 4, Y(m) + 3);

    // Mast obstacle
    if (obstacle) {
      ctx.fillStyle = '#ff6b81';
      ctx.fillRect(X(obstacle.x) - 3, Y(obstacle.height), 6, Y(0) - Y(obstacle.height));
      ctx.font = '700 10px ui-monospace, monospace';
      ctx.fillText(`${obstacle.height} m`, X(obstacle.x) - 12, Y(obstacle.height) - 6);
    }

    // Target marker
    ctx.fillStyle = '#ffc24a';
    ctx.beginPath();
    ctx.moveTo(X(targetX), Y(0));
    ctx.lineTo(X(targetX) - 8, Y(0) - 14);
    ctx.lineTo(X(targetX) + 8, Y(0) - 14);
    ctx.closePath(); ctx.fill();
    ctx.font = '700 10px ui-monospace, monospace';
    ctx.fillText(`${targetX} m`, X(targetX) - 14, Y(0) - 20);

    // Flight path so far
    if (path && path.length > 1) {
      ctx.strokeStyle = 'rgba(92,224,138,.85)';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      path.forEach((p, i) => (i ? ctx.lineTo(X(p.x), Y(p.y)) : ctx.moveTo(X(p.x), Y(p.y))));
      ctx.stroke();
    }

    // Strobe dots: equal horizontal gaps, growing vertical gaps (deck slides 104–105)
    if (strobe) {
      strobe.forEach(p => {
        ctx.fillStyle = '#2fd6c3';
        ctx.beginPath(); ctx.arc(X(p.x), Y(p.y), 3, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = 'rgba(255,194,74,.55)';
        ctx.fillRect(X(p.x) - 1, Y(p.y), 2, Y(0) - Y(p.y));
      });
    }

    // The projectile, and the simultaneously dropped marker
    if (dropPos) {
      ctx.fillStyle = '#a98bff';
      ctx.beginPath(); ctx.arc(X(1.5), Y(dropPos.y), 6, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = 'rgba(169,139,255,.45)';
      ctx.setLineDash([4, 4]); ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(X(1.5), Y(dropPos.y)); ctx.lineTo(X(view.maxX), Y(dropPos.y)); ctx.stroke();
      ctx.setLineDash([]);
    }
    if (projectilePos) {
      ctx.fillStyle = '#e8eef8';
      ctx.beginPath(); ctx.arc(X(projectilePos.x), Y(projectilePos.y), 6, 0, Math.PI * 2); ctx.fill();
    }

    // Launcher
    ctx.strokeStyle = '#93a4c0';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(X(0), Y(level.height));
    ctx.lineTo(X(0) + 20 * Math.cos(Physics.rad(opts.aim)), Y(level.height) - 20 * Math.sin(Physics.rad(opts.aim)));
    ctx.stroke();

    ctx.fillStyle = '#5f7190';
    ctx.font = '600 10px ui-monospace, monospace';
    ctx.fillText('x / m', w - pad.r - 24, h - 8);
  }

  /* ------------------------------ task 1 --------------------------------- */

  function launches(run) {
    return new Promise(resolve => {
      run.clear();
      run.setStep(0, 2);

      let level = 0, marks = 0;
      const MAX = LEVELS.length * 2;

      function startLevel() {
        if (level >= LEVELS.length) { run.award(marks, MAX); resolve(); return; }
        const L = LEVELS[level];
        run.clear();
        run.brief(`Launch ${level + 1} of ${LEVELS.length} — <strong>${L.name}.</strong> ${L.brief}`);

        const targetX = placeTarget(L);
        const obstacle = L.obstacle
          ? { x: Math.round(targetX * 0.45), height: Math.round(Physics.projectile((L.speedRange[0] + L.speedRange[1]) / 2, 50, 0).maxHeight * 0.45) }
          : null;
        const view = makeView(L, targetX);

        const { cnv, ctx, w, h } = UI.canvas(560, 360);
        run.stage.append(el('div.canvas-wrap', null, cnv));
        const readouts = UI.readout({
          ux: { label: 'uₓ = u cos θ' },
          uy: { label: 'u_y = u sin θ' },
          T:  { label: 'time of flight' },
          R:  { label: 'predicted range' }
        });
        run.stage.append(readouts.wrap);

        const panel = el('div.panel');
        run.side.append(panel);

        const speed = UI.slider({
          label: 'Launch speed u', min: L.speedRange[0], max: L.speedRange[1], step: 0.5,
          value: (L.speedRange[0] + L.speedRange[1]) / 2, unit: 'm s⁻¹', onInput: refresh
        });
        const angle = L.angleLocked ? null : UI.slider({
          label: 'Launch angle θ', min: L.angleRange[0], max: L.angleRange[1], step: 1,
          value: L.angle, unit: '°', onInput: refresh
        });

        let attempts = 0, firing = false, shot = null, lastStrobe = null;
        const status = el('div.chips');
        const fireBtn = el('button.btn.btn--primary.btn--wide.mt', { type: 'button', onClick: fire }, '🎯 Fire');

        panel.append(
          el('div.eyebrow', null, `Launch bay ${level + 1} of ${LEVELS.length}`),
          el('p.small', { html: `Target at <strong>${targetX} m</strong>, from a launch height of <strong>${L.height} m</strong>.${obstacle ? ` The mast is <strong>${obstacle.height} m</strong> tall at <strong>${obstacle.x} m</strong>.` : ''} Land within <strong>±${L.tol} m</strong>.` }),
          status,
          speed.wrap,
          angle ? angle.wrap : el('p.small.muted', { html: 'Angle locked at <strong>0°</strong> — a horizontal launch.' }),
          fireBtn
        );

        function currentAim() {
          return { u: speed.value, angle: angle ? angle.value : L.angle };
        }

        function refresh() {
          const { u, angle: th } = currentAim();
          const f = Physics.projectile(u, th, L.height);
          readouts.set('ux', `${Physics.fix(f.ux, 2)} m s⁻¹`);
          readouts.set('uy', `${Physics.fix(f.uy, 2)} m s⁻¹`);
          readouts.set('T', `${Physics.fix(f.timeOfFlight, 2)} s`);
          readouts.set('R', shot ? `${Physics.fix(shot.flight.range, 1)} m` : '—');
          status.innerHTML = '';
          status.append(el('span.chip', null, `attempt ${attempts + 1}`));
          if (attempts > 0 && shot) {
            const miss = shot.flight.range - targetX;
            status.append(el('span.chip.chip--gold', null, miss > 0 ? `last shot ${Physics.sig(miss, 2)} m long` : `last shot ${Physics.sig(-miss, 2)} m short`));
          }
          if (!firing) {
            // Keep the last strobe on screen so the cadet can study the shot.
            drawScene(ctx, w, h, { level: L, targetX, view, aim: th, obstacle, path: null, strobe: lastStrobe, projectilePos: null, dropPos: null });
          }
        }

        function fire() {
          if (firing) return;
          firing = true;
          attempts++;
          lastStrobe = null;
          fireBtn.disabled = true;
          const { u, angle: th } = currentAim();
          const flight = Physics.projectile(u, th, L.height);
          shot = { u, angle: th, h: L.height, flight };

          const path = [];
          let t = 0;
          // Did the pack pass over the mast?  Only meaningful if it got that far.
          const clearedMast = !obstacle
            || flight.range < obstacle.x
            || flight.at(obstacle.x / flight.ux).y > obstacle.height;
          const anim = Zone.loop(dt => {
            t = Math.min(t + dt * 0.85, flight.timeOfFlight);
            const p = flight.at(t);
            path.push({ x: p.x, y: p.y });
            const drop = L.showDrop ? { y: Math.max(0, L.height - 0.5 * G * t * t) } : null;
            drawScene(ctx, w, h, {
              level: L, targetX, view, aim: th, obstacle,
              path, projectilePos: p, dropPos: drop
            });
            readouts.set('R', `${Physics.fix(p.x, 1)} m`);
            if (t >= flight.timeOfFlight) {
              anim.stop();
              firing = false;
              land(flight, clearedMast, th);
            }
          });
        }

        function land(flight, clearedMast, th) {
          const miss = flight.range - targetX;
          const onTarget = Math.abs(miss) <= L.tol && clearedMast;

          // Strobe the finished path: equal horizontal steps, growing vertical ones.
          lastStrobe = [];
          for (let t = 0; t <= flight.timeOfFlight + 1e-9; t += flight.timeOfFlight / 12) lastStrobe.push(flight.at(t));

          refresh();
          fireBtn.disabled = false;

          if (!onTarget) {
            const why = (!clearedMast && flight.range >= obstacle.x)
              ? `The pack struck the mast. It needs more height at x = ${obstacle.x} m — try a steeper angle or more speed.`
              : (miss > 0
                ? `Overshot by ${Physics.sig(miss, 2)} m. ${L.angleLocked ? 'The angle is fixed, so the only lever is the launch speed: range = u\u2093 \u00d7 T, and T is set entirely by the drop height.' : 'Less speed, or an angle further from 45\u00b0, shortens the range.'}`
                : `${Physics.sig(-miss, 2)} m short. ${L.angleLocked ? 'The time of flight cannot change \u2014 only u\u2093 can. Increase the launch speed.' : 'More speed, or an angle nearer 45\u00b0, lengthens it.'}`);
            UI.modal('Missed', el('div', null,
              el('p', { html: why }),
              el('p.small.muted', { html: `That shot: u<sub>x</sub> = ${Physics.sig(flight.ux, 3)} m s⁻¹, u<sub>y</sub> = ${Physics.sig(flight.uy, 3)} m s⁻¹, time of flight ${Physics.sig(flight.timeOfFlight, 3)} s, range = u<sub>x</sub> × T = ${Physics.sig(flight.range, 3)} m.` })
            ), [{ label: 'Re-aim', primary: true }]);
            return;
          }

          // On target. Award, then ask the question that tests the maths behind it.
          const firstTry = attempts === 1;
          marks++;
          Game.addXp(firstTry ? 110 : 70);
          if (L.showDrop) Game.awardBadge('independence');

          const body = el('div', null,
            el('p', { html: `Landed <strong>${Physics.sig(Math.abs(miss), 2)} m</strong> from the marker${firstTry ? ' — first attempt.' : `, on attempt ${attempts}.`}` })
          );
          if (L.showDrop) {
            body.append(el('p.small.muted', { html: `The dropped marker (violet) hit the water at the <strong>same instant</strong>, ${Physics.sig(flight.timeOfFlight, 3)} s after release. Horizontal speed does nothing to the vertical motion — that is the Shoot-n-Drop result.` }));
          }
          body.append(el('p.small.muted', { html: 'The teal dots are a strobe at equal time intervals: equal horizontal gaps (v<sub>x</sub> constant), growing vertical gaps (v<sub>y</sub> increasing).' }));

          UI.modal('On target ✓', body, [{ label: 'Log the shot ▶', primary: true, onClick: () => askQuestion(shot) }]);
        }

        function askQuestion(s) {
          const slot = el('div');
          panel.append(el('div.eyebrow.mt', null, 'Shot analysis'), slot);
          fireBtn.disabled = true;
          UI.ask(slot, L.question(s), ({ correct }) => {
            if (correct) { marks++; Game.addXp(45); }
            level++;
            setTimeout(startLevel, 200);
          });
          slot.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        refresh();
      }

      startLevel();
    });
  }

  /* ------------------------------ zone entry ----------------------------- */

  async function render(root) {
    const run = Shell.zone(root, META);
    await launches(run);

    run.clear();
    run.setStep(1, 2);
    run.brief('Task 2 — <strong>Flight check.</strong> The projectile traps, straight from the deck.');
    run.stage.append(el('div.panel', null,
      el('div.eyebrow', null, 'The method never changes'),
      el('ul.tight', { html: `
        <li>Resolve: u<sub>x</sub> = u cos θ, u<sub>y</sub> = u sin θ.</li>
        <li>Write two columns, horizontal and vertical.</li>
        <li>Get the time from the vertical column, then use it horizontally.</li>
        <li>Recombine at the end: v = √(v<sub>x</sub>² + v<sub>y</sub>²), tan θ = v<sub>y</sub>/v<sub>x</sub>.</li>` })
    ));

    const qs = Questions.sample(Questions.banks.s4, 5);
    const correct = await Shell.askAll(run.side, qs, { title: 'Licence check', xp: 30 });
    run.award(correct, qs.length);
    run.setStep(2, 2);
    await run.finish();
  }

  return { META, render };
})();

</script>
<script>
/* ==========================================================================
   zone5.js — S5 Fluid resistance: "Drop Zone"
   Task 1  Skydive   — a real quadratic-drag integration. Reach terminal speed,
           then deploy: the v–t trace the cadet draws by falling IS the graph
           from the deck's worked example (points A to E).
   Task 2  Air on/off — the same launch in a vacuum and in air, then the
           six-effects table from the deck.
   Task 3  Flight check.
   ========================================================================== */

const Zone5 = (() => {
  'use strict';
  const el = UI.el;
  const ACCENT = '#ff6b81';
  const G = Physics.G;

  const META = {
    id: 'z5',
    tag: 'Zone 5 · S5',
    name: 'Drop Zone',
    subtitle: 'Fluid resistance: terminal speed and what drag does to a projectile',
    accent: ACCENT,
    steps: 3,
    praise: 'Safe landings all round. You can argue about forces, not just numbers.',
    revise: 'Re-read S5 steps 1–7: drag opposes velocity and grows with speed, terminal speed is where drag = weight, and the equations of motion no longer apply.',
    recap: [
      'Drag opposes the velocity and grows with speed. At release v = 0, so drag = 0 and a = g.',
      'Terminal speed: drag = weight, resultant force = 0, a = 0 — but both forces still act.',
      'Just after the parachute opens the acceleration is <strong>upwards</strong> while she still moves down.',
      'With drag: lower peak, shorter range, shorter time of flight, lower landing speed, asymmetric path.'
    ]
  };

  /* ------------------------------ task 1: the skydive -------------------- */

  const JUMP = {
    startHeight: 3000,      // m, a realistic exit altitude
    freeFallTerminal: 55,   // m s⁻¹, belly-to-earth
    chuteTerminal: 5.5,     // m s⁻¹, canopy open
    safeLanding: 7.0,       // m s⁻¹
    timeScale: 3,           // simulated seconds per real second while falling
    fastScale: 60           // once the canopy transient is over, skip the drift
  };

  function skydive(run) {
    return new Promise(resolve => {
      run.clear();
      run.setStep(0, 3);
      run.brief('Task 1 — <strong>The jump.</strong> Fall until the acceleration reading drops to <strong>zero</strong> — that is terminal speed, where drag has grown to balance weight. Then deploy, and land at no more than 7 m s⁻¹.');

      const sceneC = UI.canvas(240, 400);
      const graphC = UI.canvas(300, 400);
      run.stage.append(el('div.row', { style: { gap: '10px', alignItems: 'stretch' } },
        el('div.canvas-wrap', { style: { flex: '0 0 auto' } }, sceneC.cnv),
        el('div.canvas-wrap', { style: { flex: '1 1 220px' } }, graphC.cnv)
      ));
      const readouts = UI.readout({
        t: { label: 'time' }, y: { label: 'altitude' }, v: { label: 'speed' }, a: { label: 'acceleration' }
      });
      run.stage.append(readouts.wrap);

      const panel = el('div.panel');
      run.side.append(panel);

      const state = {
        y: JUMP.startHeight, v: 0, t: 0,
        deployed: false, deployT: null, deployV: null, landed: false,
        reachedTerminal: false, maxSpeed: 0,
        trace: []
      };

      let c = Physics.dragCoefficient(JUMP.freeFallTerminal);

      const deployBtn = el('button.btn.btn--gold.btn--wide', { type: 'button', onClick: deploy }, '🪂 Deploy parachute');
      const status = el('div.chips');
      panel.append(
        el('div.eyebrow', null, 'Jump console'),
        el('p.small', { html: `Exit altitude <strong>${JUMP.startHeight} m</strong>. Free-fall terminal speed for this suit is about <strong>${JUMP.freeFallTerminal} m s⁻¹</strong>; under canopy it is about <strong>${JUMP.chuteTerminal} m s⁻¹</strong>. Land at <strong>≤ ${JUMP.safeLanding} m s⁻¹</strong>.` }),
        status,
        deployBtn,
        el('p.small.muted.mt.mb0', { html: 'Watch the acceleration reading, not the clock: it starts at 9.81 m s⁻² and falls towards zero as drag builds.' })
      );

      function deploy() {
        if (state.deployed || state.landed) return;
        state.deployed = true;
        state.deployT = state.t;
        state.deployV = Math.abs(state.v);
        c = Physics.dragCoefficient(JUMP.chuteTerminal);
        deployBtn.disabled = true;
        deployBtn.textContent = '🪂 Canopy open';
      }

      function chips() {
        status.innerHTML = '';
        status.append(
          el('span.chip' + (state.reachedTerminal ? '.chip--on' : ''), null,
            state.reachedTerminal ? 'terminal speed reached ✓' : 'terminal speed not yet reached'),
          el('span.chip' + (state.deployed ? '.chip--gold' : ''), null,
            state.deployed ? `deployed at ${Physics.fix(state.deployT, 1)} s` : 'canopy stowed')
        );
      }

      function drawScene() {
        const { ctx, w, h } = sceneC;
        ctx.clearRect(0, 0, w, h);
        const sky = ctx.createLinearGradient(0, 0, 0, h);
        sky.addColorStop(0, '#0d1c33');
        sky.addColorStop(1, '#050a12');
        ctx.fillStyle = sky; ctx.fillRect(0, 0, w, h);

        const groundY = h - 26;
        const Y = m => groundY - (m / JUMP.startHeight) * (groundY - 24);

        ctx.fillStyle = '#16233b';
        ctx.fillRect(0, groundY, w, 26);
        ctx.strokeStyle = 'rgba(36,52,79,.9)';
        ctx.fillStyle = '#5f7190';
        ctx.font = '10px ui-monospace, monospace';
        for (let m = 0; m <= JUMP.startHeight; m += 500) {
          ctx.beginPath(); ctx.moveTo(40, Y(m)); ctx.lineTo(w, Y(m)); ctx.stroke();
          ctx.fillText(`${m}`, 6, Y(m) + 4);
        }

        const py = Y(Math.max(0, state.y));
        const px = w / 2 + 14;
        // Canopy
        if (state.deployed) {
          ctx.strokeStyle = '#ffc24a'; ctx.lineWidth = 2;
          ctx.beginPath(); ctx.arc(px, py - 22, 17, Math.PI, 0); ctx.stroke();
          ctx.beginPath();
          ctx.moveTo(px - 17, py - 22); ctx.lineTo(px, py - 6);
          ctx.lineTo(px + 17, py - 22); ctx.stroke();
        }
        // Jumper
        ctx.fillStyle = state.landed ? '#5ce08a' : '#e8eef8';
        ctx.beginPath(); ctx.arc(px, py, 6, 0, Math.PI * 2); ctx.fill();

        // Force arrows: weight always, drag growing with speed.
        const speed = Math.abs(state.v);
        const terminal = state.deployed ? JUMP.chuteTerminal : JUMP.freeFallTerminal;
        const dragLen = 46 * Math.min(1.4, (speed * speed) / (terminal * terminal));
        forceArrow(ctx, px + 34, py, 46, '#ff6b81', 'W');
        if (dragLen > 2) forceArrow(ctx, px + 34, py, -dragLen, '#2fd6c3', 'drag');
      }

      function forceArrow(ctx, x, y, len, colour, label) {
        // len > 0 points down (weight), len < 0 points up (drag)
        ctx.strokeStyle = colour; ctx.fillStyle = colour; ctx.lineWidth = 3;
        ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + len); ctx.stroke();
        const s = Math.sign(len);
        ctx.beginPath();
        ctx.moveTo(x, y + len);
        ctx.lineTo(x - 6, y + len - s * 9);
        ctx.lineTo(x + 6, y + len - s * 9);
        ctx.fill();
        ctx.font = '700 10px ui-monospace, monospace';
        ctx.fillText(label, x + 8, y + len / 2);
      }

      function drawGraph() {
        const { ctx, w, h } = graphC;
        const pts = state.trace.map(p => ({ t: p.t, v: p.speed }));
        if (pts.length < 2) {
          ctx.fillStyle = '#050a12'; ctx.fillRect(0, 0, w, h);
          return;
        }
        const tMax = Math.max(20, Math.ceil(pts[pts.length - 1].t / 10) * 10);
        Zone2.drawVT(ctx, w, h, pts, {
          tMax, vMin: 0, vMax: JUMP.freeFallTerminal * 1.15, colour: '#2fd6c3', shade: false
        });
        // Terminal-speed guide lines make "a = 0" visible as a flat trace.
        const pad = { l: 52, r: 16, t: 22, b: 36 };
        const Y = v => h - pad.b - (v / (JUMP.freeFallTerminal * 1.15)) * (h - pad.t - pad.b);
        ctx.setLineDash([5, 4]); ctx.lineWidth = 1.5;
        ctx.strokeStyle = 'rgba(255,194,74,.7)';
        ctx.beginPath(); ctx.moveTo(pad.l, Y(JUMP.freeFallTerminal)); ctx.lineTo(w - pad.r, Y(JUMP.freeFallTerminal)); ctx.stroke();
        ctx.strokeStyle = 'rgba(92,224,138,.7)';
        ctx.beginPath(); ctx.moveTo(pad.l, Y(JUMP.chuteTerminal)); ctx.lineTo(w - pad.r, Y(JUMP.chuteTerminal)); ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle = '#ffc24a'; ctx.font = '10px ui-monospace, monospace';
        ctx.fillText('free-fall terminal', pad.l + 4, Y(JUMP.freeFallTerminal) - 5);
        ctx.fillStyle = '#5ce08a';
        ctx.fillText('canopy terminal', pad.l + 4, Y(JUMP.chuteTerminal) - 5);
      }

      const anim = Zone.loop(dt => {
        if (!state.landed) {
          // Watch the canopy transient at normal pace, then fast-forward the drift.
          const settled = state.deployed && (state.t - state.deployT) > 5;
          const simStep = Math.min(dt, 0.05) * (settled ? JUMP.fastScale : JUMP.timeScale);
          const sub = Math.max(1, Math.ceil(simStep / 0.01));
          for (let i = 0; i < sub; i++) {
            const next = Physics.stepDrag({ x: 0, y: state.y, vx: 0, vy: state.v }, simStep / sub, c);
            state.y = next.y; state.v = next.vy;
            state.t += simStep / sub;
            if (state.y <= 0) { state.y = 0; state.landed = true; break; }
          }
          const speed = Math.abs(state.v);
          state.maxSpeed = Math.max(state.maxSpeed, speed);
          if (!state.deployed && speed >= JUMP.freeFallTerminal * 0.99) state.reachedTerminal = true;
          if (state.trace.length === 0 || state.t - state.trace[state.trace.length - 1].t > 0.15) {
            state.trace.push({ t: state.t, speed, a: Math.abs(Physics.accelWithDrag(0, state.v, c).ay) });
          }
        }

        const a = Physics.accelWithDrag(0, state.v, c).ay;
        readouts.set('t', `${Physics.fix(state.t, 1)} s`);
        readouts.set('y', `${Physics.fix(Math.max(0, state.y), 0)} m`);
        readouts.set('v', `${Physics.fix(Math.abs(state.v), 1)} m s⁻¹`);
        readouts.set('a', `${Physics.fix(Math.abs(a), 2)} m s⁻²`);
        chips();
        drawScene();
        drawGraph();

        if (state.landed) { anim.stop(); deployBtn.disabled = true; finishJump(); }
      });

      function finishJump() {
        const landingSpeed = Math.abs(state.v);
        const safe = landingSpeed <= JUMP.safeLanding;
        let marks = 0;
        if (safe) marks++;
        if (state.reachedTerminal) marks++;
        if (safe) { Game.addXp(90); Game.awardBadge('terminal'); }

        const body = el('div');
        body.append(el('p', { html: safe
          ? `Landed at <strong>${Physics.fix(landingSpeed, 1)} m s⁻¹</strong> — a safe landing.`
          : `Landed at <strong>${Physics.fix(landingSpeed, 1)} m s⁻¹</strong>. That is above the ${JUMP.safeLanding} m s⁻¹ limit${state.deployed ? ' — the canopy opened too late to reach its terminal speed.' : ' — the canopy never opened.'}` }));
        if (!state.reachedTerminal) {
          body.append(el('p.small.muted', { html: 'You deployed before the acceleration reading reached zero, so you never actually reached free-fall terminal speed. Try holding the fall until a = 0.' }));
        }
        body.append(el('p.small.muted', { html: `Peak speed <strong>${Physics.fix(state.maxSpeed, 1)} m s⁻¹</strong>${state.deployed ? `, canopy opened at <strong>${Physics.fix(state.deployT, 1)} s</strong> while falling at ${Physics.fix(state.deployV, 1)} m s⁻¹` : ''}. At terminal speed, weight and drag are equal and opposite: the resultant force is zero, so a = 0 — but both forces are still there.` }));

        run.award(marks, 2);

        UI.modal(safe ? 'Safe landing ✓' : 'Hard landing', body, [
          { label: 'Read the trace ▶', primary: true, onClick: () => askAboutJump(state) }
        ]);
      }

      function askAboutJump(s) {
        const qs = [
          {
            type: 'mcq', badge: 'terminal',
            stem: `While you were falling at a steady ${Physics.fix(JUMP.freeFallTerminal, 0)} m s⁻¹ — the flat part of your trace — what was the <strong>resultant force</strong> on you?`,
            options: [
              { text: 'Zero: drag had grown until it balanced your weight' },
              { text: 'Equal to your weight, downwards', why: 'Weight is one of the two forces acting, not the resultant of both.' },
              { text: 'Upwards, because drag had become larger than weight', why: 'That is what happens just after the canopy opens, not at a steady terminal speed.' },
              { text: 'Small and downwards, to keep you falling', why: 'Constant velocity needs no resultant force at all.' }
            ],
            answer: 0,
            work: 'Constant velocity → a = 0 → resultant force = 0.\nThe flat trace is the direct evidence: no change in velocity.'
          },
          {
            type: 'mcq', badge: 'terminal',
            stem: 'In the instant <strong>after</strong> your canopy opened, which way did you <strong>accelerate</strong>, and which way did you <strong>move</strong>?',
            options: [
              { text: 'Accelerated upwards, moved downwards' },
              { text: 'Accelerated downwards, moved downwards', why: 'Your speed dropped sharply, so the acceleration opposed your motion — it pointed up.' },
              { text: 'Accelerated upwards, moved upwards', why: 'You kept falling. Slowing down while moving down is not the same as moving up.' },
              { text: 'Neither — the forces balanced immediately', why: 'The trace falls steeply after deployment, so there was a large resultant force for a while.' }
            ],
            answer: 0,
            work: 'The canopy\'s large area makes drag ≫ weight, so the resultant force is upwards.\nYou keep moving down, but slow rapidly, until drag falls back to equal weight at the new, lower terminal speed.'
          },
          {
            type: 'mcq',
            stem: 'At the very start of the jump, when your speed was still zero, what was your acceleration?',
            options: [
              { text: '9.81 m s⁻² downwards, because drag = 0 at v = 0' },
              { text: 'Zero, because you had not started moving', why: 'Your weight acts from the first instant, so you accelerate from the first instant.' },
              { text: 'Less than 9.81 m s⁻², because air was already resisting', why: 'Drag grows with speed. At v = 0 there is no drag at all.' },
              { text: 'Greater than 9.81 m s⁻²', why: 'Nothing pushes you down harder than your own weight.' }
            ],
            answer: 0,
            work: 'Drag depends on speed, and the speed was zero, so drag was zero.\nResultant force = weight → a = g = 9.81 m s⁻² downwards. That is why the trace starts at its steepest.'
          }
        ];

        run.side.innerHTML = '';
        Shell.askAll(run.side, qs, { title: 'Jump debrief', xp: 35 }).then(correct => {
          run.award(correct, qs.length);
          resolve();
        });
      }
    });
  }

  /* ------------------------------ task 2: air on / air off ---------------- */

  /* The golf ball from the deck: 20 m s⁻¹ at 35°.  A terminal speed of
     22 m s⁻¹ reproduces the deck's model figures (range 38 m → 25 m,
     height 6.7 m → 5.3 m, time 2.3 s → 2.1 s). */
  const BALL = { u: 20, angle: 35, terminal: 22 };

  function airOnOff(run) {
    return new Promise(resolve => {
      run.clear();
      run.setStep(1, 3);
      run.brief('Task 2 — <strong>Air on, air off.</strong> The same launch, twice: once in a vacuum, once in air. Compare the two paths, then complete the six-effects table.');

      const vac = Physics.trajectory(BALL.u, BALL.angle, 0, 160);
      const air = Physics.dragFlight(BALL.u, BALL.angle, 0, BALL.terminal, 0.002);

      const { cnv, ctx, w, h } = UI.canvas(560, 330);
      run.stage.append(el('div.canvas-wrap', null, cnv));

      let reveal = 0;
      const anim = Zone.loop(dt => {
        reveal = Math.min(1, reveal + dt * 0.35);
        drawCompare(ctx, w, h, vac, air, reveal);
      });

      run.stage.append(el('div.panel.mt', null,
        el('div.eyebrow', null, `Launch: ${BALL.u} m s⁻¹ at ${BALL.angle}° above the horizontal`),
        el('table.data', { html: `
          <tr><th>Quantity</th><th>Vacuum</th><th>In air</th></tr>
          <tr><td>Range</td><td class="num">${Physics.sig(vac.summary.range, 3)} m</td><td class="num">${Physics.sig(air.range, 3)} m</td></tr>
          <tr><td>Maximum height</td><td class="num">${Physics.sig(vac.summary.maxHeight, 3)} m</td><td class="num">${Physics.sig(air.maxHeight, 3)} m</td></tr>
          <tr><td>Time of flight</td><td class="num">${Physics.sig(vac.summary.timeOfFlight, 3)} s</td><td class="num">${Physics.sig(air.timeOfFlight, 3)} s</td></tr>
          <tr><td>Landing speed</td><td class="num">${Physics.sig(vac.summary.landingSpeed, 3)} m s⁻¹</td><td class="num">${Physics.sig(air.landingSpeed, 3)} m s⁻¹</td></tr>` }),
        el('p.small.muted.mt.mb0', { html: 'These are the deck\'s model figures: the same launch loses about a third of its range once the air is switched on.' })
      ));

      /* The six-effects table from the deck, as a set of dropdowns. */
      const ROWS = [
        { q: 'Maximum height', a: 'smaller', why: 'Going up, drag and weight both act downwards, so the ball slows faster and peaks lower.' },
        { q: 'Range', a: 'smaller', why: 'Drag has a backwards horizontal component, so v<sub>x</sub> falls and less ground is covered.' },
        { q: 'Time of flight', a: 'smaller', why: 'The descent is slower, but the much lower peak wins: the total is shorter.' },
        { q: 'Horizontal velocity during the flight', a: 'no longer constant', why: 'Without drag v<sub>x</sub> never changes. With drag it decreases throughout, so it is no longer constant.' },
        { q: 'Landing speed', a: 'smaller', why: 'Energy is transferred to the air, so the ball lands more slowly than it was launched.' },
        { q: 'Acceleration during the flight', a: 'no longer constant', why: 'Greater than g going up, exactly g at the top where v = 0, less than g coming down.' }
      ];
      const OPTIONS = ['smaller', 'larger', 'no longer constant'];

      const selects = [];
      const rowsHtml = el('tbody');
      ROWS.forEach((row, i) => {
        const sel = el('select', { 'aria-label': row.q });
        sel.append(el('option', { value: '' }, '— choose —'));
        OPTIONS.forEach(o => sel.append(el('option', { value: o }, o)));
        selects.push(sel);
        const verdict = el('td');
        const tr = el('tr', null, el('td', { html: row.q }), el('td', null, sel), verdict);
        row.verdictCell = verdict;
        rowsHtml.append(tr);
      });

      const checkBtn = el('button.btn.btn--primary.btn--wide.mt', { type: 'button', onClick: check }, 'Submit the table');
      run.side.append(el('div.panel', null,
        el('div.eyebrow', null, 'Six effects of fluid resistance'),
        el('p.small.muted', { html: 'Compared with the same launch in a vacuum, each quantity becomes:' }),
        el('table.data', null, el('thead', { html: '<tr><th>Quantity</th><th>In air it is…</th><th></th></tr>' }), rowsHtml),
        checkBtn
      ));

      function check() {
        let correct = 0;
        ROWS.forEach((row, i) => {
          const given = selects[i].value;
          const ok = given === row.a;
          if (ok) correct++;
          selects[i].disabled = true;
          row.verdictCell.innerHTML = '';
          row.verdictCell.append(el('span', { style: { color: ok ? '#5ce08a' : '#ff6b81', fontWeight: '700' } }, ok ? '✓' : '✗'));
          if (!ok) {
            row.verdictCell.append(el('div.small.muted', { html: `<strong>${row.a}</strong> — ${row.why}` }));
          }
        });
        checkBtn.disabled = true;
        Game.recordAnswer(correct >= 5);
        Game.addXp(correct * 25);
        if (correct >= 5) Game.awardBadge('dragaware');
        run.award(correct, ROWS.length);
        anim.stop();
        reveal = 1;
        drawCompare(ctx, w, h, vac, air, 1);

        UI.modal('Table checked', el('div', null,
          el('p', { html: `<strong>${correct} of ${ROWS.length}</strong> correct.` }),
          el('p.small.muted', { html: 'Drag opposes the velocity and grows with speed, so the horizontal and vertical motions are no longer independent — and the four equations of motion no longer apply.' })
        ), [{ label: 'Continue ▶', primary: true, onClick: resolve }]);
      }
    });
  }

  function drawCompare(ctx, w, h, vac, air, reveal) {
    const pad = { l: 40, r: 18, t: 20, b: 34 };
    const maxX = Math.max(vac.summary.range, air.range) * 1.08;
    const maxY = Math.max(vac.summary.maxHeight, air.maxHeight) * 1.35;
    const X = m => pad.l + (m / maxX) * (w - pad.l - pad.r);
    const Y = m => h - pad.b - (m / maxY) * (h - pad.t - pad.b);

    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = '#050a12'; ctx.fillRect(0, 0, w, h);

    ctx.strokeStyle = 'rgba(36,52,79,.8)'; ctx.lineWidth = 1;
    ctx.fillStyle = '#5f7190'; ctx.font = '10px ui-monospace, monospace';
    for (let m = 0; m <= maxX; m += 5) {
      ctx.beginPath(); ctx.moveTo(X(m), pad.t); ctx.lineTo(X(m), Y(0)); ctx.stroke();
      if (m % 10 === 0) ctx.fillText(`${m}`, X(m) - 5, h - pad.b + 14);
    }
    for (let m = 0; m <= maxY; m += 2) {
      ctx.beginPath(); ctx.moveTo(pad.l, Y(m)); ctx.lineTo(w - pad.r, Y(m)); ctx.stroke();
    }
    ctx.fillStyle = '#16233b';
    ctx.fillRect(pad.l, Y(0), w - pad.l - pad.r, h - pad.b - Y(0) + 14);

    const drawPath = (pts, colour, dash, upTo) => {
      ctx.strokeStyle = colour; ctx.lineWidth = 2.6; ctx.setLineDash(dash);
      ctx.beginPath();
      const n = Math.max(2, Math.floor(pts.length * upTo));
      for (let i = 0; i < n; i++) {
        const p = pts[i];
        if (i === 0) ctx.moveTo(X(p.x), Y(p.y)); else ctx.lineTo(X(p.x), Y(p.y));
      }
      ctx.stroke();
      ctx.setLineDash([]);
      const head = pts[Math.min(n - 1, pts.length - 1)];
      ctx.fillStyle = colour;
      ctx.beginPath(); ctx.arc(X(head.x), Y(head.y), 5, 0, Math.PI * 2); ctx.fill();
    };

    drawPath(vac.path, '#ffc24a', [7, 5], reveal);
    drawPath(air.path, '#2fd6c3', [], reveal);

    ctx.font = '700 11px ui-monospace, monospace';
    ctx.fillStyle = '#ffc24a'; ctx.fillText('vacuum — symmetric parabola', pad.l + 6, pad.t + 12);
    ctx.fillStyle = '#2fd6c3'; ctx.fillText('in air — lower peak, steeper descent', pad.l + 6, pad.t + 28);
    ctx.fillStyle = '#5f7190'; ctx.fillText('x / m', w - pad.r - 26, h - 8);
  }

  /* ------------------------------ zone entry ----------------------------- */

  async function render(root) {
    const run = Shell.zone(root, META);
    await skydive(run);
    await airOnOff(run);

    run.clear();
    run.setStep(2, 3);
    run.brief('Task 3 — <strong>Flight check.</strong> Fluid resistance is examined qualitatively — these are the explanations that earn the marks.');
    run.stage.append(el('div.panel', null,
      el('div.eyebrow', null, 'S5 key ideas'),
      el('ul.tight', { html: `
        <li>Drag opposes the velocity and <strong>grows with speed</strong>; at v = 0 there is none.</li>
        <li>Falling: resultant = weight − drag, so a falls as v rises.</li>
        <li>Terminal speed: drag = weight, resultant = 0, a = 0 — both forces still act.</li>
        <li>Going up |a| > g; at the top |a| = g; coming down |a| < g.</li>
        <li>The equations of motion do not apply, because a is not uniform.</li>` })
    ));

    const qs = Questions.sample(Questions.banks.s5, 5);
    const correct = await Shell.askAll(run.side, qs, { title: 'Licence check', xp: 30 });
    run.award(correct, qs.length);
    run.setStep(3, 3);
    await run.finish();
  }

  return { META, render };
})();

</script>
<script>
/* ==========================================================================
   finalmission.js — "Mission Alpha", the whole-topic run.
   The five hinge questions from the teaching deck, plus a sample from every
   subtopic.  Three hull breaches and the run ends — so it rewards the cadet
   who has actually retired the misconceptions, not one who guesses.
   ========================================================================== */

const FinalMission = (() => {
  'use strict';
  const el = UI.el;
  const ACCENT = '#a98bff';

  const META = {
    id: 'final',
    tag: 'Mission Alpha',
    name: 'The Big Question',
    subtitle: 'How can we predict where a moving object will be, and when?',
    accent: ACCENT,
    steps: 1,
    requires: ['z1', 'z2', 'z3', 'z4', 'z5']
  };

  const HULL = 3;

  function buildPaper() {
    // The five hinge questions always appear — they are the checkpoints the
    // teaching deck says to clear before moving on.
    const paper = Questions.hinges();
    ['s1', 's2', 's3', 's4', 's5'].forEach(key => {
      const rest = Questions.banks[key].filter(q => q.tag !== 'HINGE');
      paper.push(...Questions.sample(rest, 1));
    });
    return Questions.sample(paper, paper.length);   // shuffle
  }

  function render(root) {
    const run = Shell.zone(root, META);
    const paper = buildPaper();
    let i = 0, correct = 0, hull = HULL;

    run.brief('Every subtopic, one paper. Three hull breaches and the mission ends — so take the time to reason, not to guess.');

    const hullChips = el('div.chips');
    const slot = el('div');
    const summary = el('div.panel', null,
      el('div.eyebrow', null, 'Topic summary'),
      el('ul.tight', { html: `
        <li><strong>Describe</strong> — displacement, velocity and acceleration are vectors; gradients and areas read the graphs.</li>
        <li><strong>Predict</strong> — uniform acceleration only: the four equations, with a stated sign convention.</li>
        <li><strong>Two dimensions</strong> — apply them separately to the components, linked by the time.</li>
        <li><strong>Limits</strong> — with fluid resistance the simple model overestimates height, range and time.</li>` })
    );
    run.stage.append(summary);
    run.side.append(el('div.panel', null, el('div.eyebrow', null, 'Paper'), hullChips, slot));

    function drawHull() {
      hullChips.innerHTML = '';
      hullChips.append(
        el('span.chip.chip--on', null, `Q ${Math.min(i + 1, paper.length)} of ${paper.length}`),
        el('span.chip' + (hull > 1 ? '.chip--gold' : ''), null, `hull ${'▮'.repeat(hull)}${'▯'.repeat(HULL - hull)}`),
        el('span.chip', null, `${correct} correct`)
      );
    }

    function next() {
      drawHull();
      if (hull <= 0 || i >= paper.length) { finish(); return; }
      UI.ask(slot, paper[i], ({ correct: ok }) => {
        if (ok) { correct++; Game.addXp(50); } else { hull--; }
        i++;
        next();
      });
    }

    function finish() {
      const answered = i;
      const stars = Shell.starsFor(correct, paper.length);
      run.award(correct, paper.length);
      const passed = correct >= 8 && hull > 0;
      if (passed) Game.awardBadge('commander');

      const body = el('div');
      body.append(el('div.stars-big', null, UI.stars(stars, 5)));
      body.append(el('p.center', { html: hull > 0
        ? `<strong>${correct} of ${paper.length}</strong> correct.`
        : `Hull breached after ${answered} questions — <strong>${correct}</strong> correct.` }));
      body.append(el('p', { html: passed
        ? 'Mission Alpha cleared. You can describe motion, predict it, extend it to two dimensions, and say exactly where the simple model stops being true.'
        : 'Not cleared this time. Go back to the zone whose ideas cost you the hull — the debrief lists what to re-read.' }));

      const missed = paper.slice(0, answered).filter((q, k) => q.tag === 'HINGE');
      if (missed.length) {
        body.append(el('p.small.muted', { html: 'The hinge questions in this paper are the five checkpoints from the teaching deck. If any of them caught you, that subtopic is where to go next.' }));
      }

      UI.modal(passed ? '🎖️ Mission Alpha cleared' : 'Mission Alpha', body, [
        { label: 'Back to map', primary: true, onClick: () => Game.go('map') },
        { label: 'Run it again', onClick: () => Game.go('zone', { id: 'final' }) }
      ]);
      Game.finishZone('final', { stars, score: correct });
    }

    next();
  }

  return { META, render };
})();

</script>
<script>
/* ==========================================================================
   main.js — title screen, mission map, and the routes that tie them together.
   ========================================================================== */

(() => {
  'use strict';
  const el = UI.el;

  const ZONES = [Zone1, Zone2, Zone3, Zone4, Zone5];
  const ALL = [...ZONES, FinalMission];
  const byId = id => ALL.find(z => z.META.id === id);

  /* Each zone opens once the one before it has been cleared. */
  ZONES.forEach((z, i) => { if (i > 0) z.META.requires = [ZONES[i - 1].META.id]; });

  const SKILLS = {
    z1: 'distance vs displacement · speed vs velocity · the sign of a',
    z2: 'gradients · tangents · areas · uniform and non-uniform acceleration',
    z3: 'the four equations · sign conventions · free fall',
    z4: 'components · two columns · time of flight, range, max height',
    z5: 'drag · terminal speed · the six effects on a projectile',
    final: 'every subtopic, including all five hinge questions'
  };

  /* ------------------------------ title ---------------------------------- */

  Game.route('title', root => {
    const nameInput = el('input', { type: 'text', maxlength: 24, value: Game.save.name === 'Pilot' ? '' : Game.save.name, placeholder: 'e.g. Amara' });

    const start = () => {
      const given = nameInput.value.trim();
      Game.save.name = given || 'Pilot';
      Game.persist();
      Game.go('map');
    };
    nameInput.addEventListener('keydown', e => { if (e.key === 'Enter') start(); });

    root.append(
      el('div.title', null,
        el('div.title__logo', null, 'VECTOR RESCUE'),
        el('p.title__sub', { html: 'IB DP Physics · Theme A · <strong>A.1 Kinematics</strong><br>Five zones, one question: where will it be, and when?' }),
        el('div.panel.title__card', null,
          el('div.eyebrow', null, 'Cadet registration'),
          el('p.small.muted', { html: 'You are a rescue pilot in training. Each zone teaches one subtopic by making you fly it — plot a route, build a velocity–time graph, pick the right equation, aim a launcher, survive a skydive.' }),
          el('label.field', null, el('span', null, 'Call sign'), nameInput),
          el('button.btn.btn--primary.btn--wide', { type: 'button', onClick: start }, 'Begin training ▶'),
          el('p.small.muted.mt.mb0', { html: `Take <strong>g = 9.81 m s⁻²</strong> throughout, exactly as the deck does. Progress saves in this browser.` })
        ),
        Game.save.xp > 0 ? el('p.small.muted.mt', { html: `Welcome back — ${Game.save.xp} XP, ${Game.totalStars()} stars so far.` }) : null
      )
    );
  });

  /* ------------------------------ mission map ---------------------------- */

  Game.route('map', root => {
    const cleared = ZONES.filter(z => Game.zoneState(z.META.id).cleared).length;

    root.append(el('div.spread', null,
      el('div', null,
        el('div.eyebrow', null, 'Mission map'),
        el('h1', { style: { marginBottom: '2px' } }, 'A.1 Kinematics'),
        el('p.muted.mb0', { html: 'Five zones follow the five subtopics of the deck, in order.' })
      ),
      el('div.center', null,
        el('div', { style: { font: '700 1.6rem ui-monospace,monospace', color: '#2fd6c3' } }, `${cleared}/5`),
        el('div.small.muted', null, 'zones cleared')
      )
    ));

    const grid = el('div.map-grid.mt');
    ALL.forEach(mod => {
      const m = mod.META;
      const st = Game.zoneState(m.id);
      const unlocked = Game.isUnlocked(m, ALL);
      const card = el('button.zone-card', {
        type: 'button',
        disabled: !unlocked,
        style: { '--accent': m.accent },
        onClick: () => Game.go('zone', { id: m.id })
      },
        el('span.zone-card__tag', { style: { color: m.accent } }, m.tag),
        el('span.zone-card__name', null, m.name),
        el('span.zone-card__sub', null, m.subtitle),
        el('span.zone-card__skills', null, SKILLS[m.id] || ''),
        el('span.zone-card__foot', null,
          el('span.zone-card__stars', null, UI.stars(st.stars, 5)),
          el('span.zone-card__best', null, st.cleared ? `best ${st.best}` : (unlocked ? 'not flown' : 'locked'))
        ),
        !unlocked ? el('span.zone-card__lock', null, '🔒') : null
      );
      grid.append(card);
    });
    root.append(grid);

    /* Badges: one per misconception retired. */
    const badges = el('div.badge-grid');
    Object.entries(Game.BADGES).forEach(([id, b]) => {
      const on = !!Game.save.badges[id];
      badges.append(el('div.badge' + (on ? '.badge--on' : ''), null,
        el('span.badge__icon', null, b.icon),
        el('span.badge__name', null, b.name),
        el('span.badge__desc', { html: on ? b.desc : 'Locked' })
      ));
    });

    const answered = Game.save.totalAnswered;
    const accuracy = answered ? Math.round((Game.save.totalCorrect / answered) * 100) : 0;

    root.append(el('div.panel.mt', null,
      el('div.spread', null,
        el('div.eyebrow', null, 'Misconceptions retired'),
        el('span.small.muted', null, answered ? `${Game.save.totalCorrect}/${answered} answered correctly · ${accuracy}%` : 'no questions answered yet')
      ),
      el('p.small.muted', { html: 'Each badge is one wrong idea from the deck\'s "common misconceptions" slides that you have now beaten.' }),
      badges
    ));

    root.append(el('div.panel', null,
      el('div.eyebrow', null, 'Revision links from the deck'),
      el('table.data', { html: `
        <tr><th>Resource</th><th>Use it for</th></tr>
        <tr><td><a href="https://phet.colorado.edu/sims/cheerpj/moving-man/latest/moving-man.html" target="_blank" rel="noopener">PhET: The Moving Man</a></td><td>S2 motion graphs</td></tr>
        <tr><td><a href="https://phet.colorado.edu/sims/html/projectile-motion/latest/projectile-motion_en.html" target="_blank" rel="noopener">PhET: Projectile Motion</a></td><td>S4 and S5</td></tr>
        <tr><td><a href="https://www.youtube.com/watch?v=E43-CfukEgs" target="_blank" rel="noopener">BBC: the world's biggest vacuum chamber</a></td><td>S3 free fall</td></tr>
        <tr><td><a href="https://www.youtube.com/watch?v=zMF4CD7i3hg" target="_blank" rel="noopener">Harvard: Shoot-n-Drop</a></td><td>S4 independence of motions</td></tr>` }),
      el('p.small.muted.mt.mb0', null, 'PhET Interactive Simulations, University of Colorado Boulder (CC-BY 4.0).'),
      el('div.btn-row.mt', null,
        el('button.btn.btn--sm.btn--ghost', {
          type: 'button',
          onClick: () => UI.modal('Reset progress?', 'This clears your XP, stars and badges on this device. It cannot be undone.', [
            { label: 'Reset everything', primary: true, onClick: () => { Game.reset(); Game.go('title'); } },
            { label: 'Keep my progress' }
          ])
        }, 'Reset progress')
      )
    ));
  });

  /* ------------------------------ zone dispatch -------------------------- */

  Game.route('zone', (root, params) => {
    const mod = byId(params.id);
    if (!mod) { Game.go('map'); return; }
    if (!Game.isUnlocked(mod.META, ALL)) { UI.toast('Clear the zone before it first.'); Game.go('map'); return; }
    Promise.resolve(mod.render(root)).catch(err => {
      console.error(err);
      UI.toast('Something went wrong in that zone — back to the map.');
      Game.go('map');
    });
  });

  /* ------------------------------ boot ----------------------------------- */

  document.addEventListener('click', e => {
    const nav = e.target.closest('[data-nav]');
    if (nav) Game.go(nav.getAttribute('data-nav'));
  });

  Game.load();
  Game.go(Game.save.xp > 0 ? 'map' : 'title');
})();

</script>
