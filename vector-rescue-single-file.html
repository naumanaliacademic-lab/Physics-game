<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vector Rescue — IB Physics A.1 Kinematics</title>
<meta name="description" content="A five-zone rescue game that teaches IB DP Physics A.1 Kinematics: describing motion, motion graphs, the equations of motion, projectiles and fluid resistance.">
<style>
/* ==========================================================================
   Vector Rescue — IB Physics A.1 Kinematics
   Deep-space rescue theme: near-black hull, teal instrumentation, gold alerts.
   ========================================================================== */

:root {
  --bg:        #070b14;
  --bg-2:      #0d1524;
  --panel:     #111b2e;
  --panel-2:   #16233b;
  --line:      #24344f;
  --ink:       #e8eef8;
  --ink-dim:   #93a4c0;
  --ink-faint: #5f7190;
  --teal:      #2fd6c3;
  --teal-dark: #17806f;
  --gold:      #ffc24a;
  --rose:      #ff6b81;
  --violet:    #a98bff;
  --green:     #5ce08a;
  --radius:    14px;
  --shadow:    0 10px 30px rgba(0,0,0,.45);
  --mono:      ui-monospace, "SFMono-Regular", "Cascadia Code", Consolas, monospace;
  --sans:      "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
  line-height: 1.5;
  -webkit-text-size-adjust: 100%;
}

body {
  min-height: 100vh;
  background-image:
    radial-gradient(1200px 600px at 15% -10%, rgba(47,214,195,.10), transparent 60%),
    radial-gradient(900px 500px at 95% 0%, rgba(169,139,255,.10), transparent 60%);
  background-attachment: fixed;
}

h1, h2, h3 { line-height: 1.2; margin: 0 0 .4em; font-weight: 700; letter-spacing: .01em; }
h1 { font-size: clamp(1.8rem, 5vw, 3rem); }
h2 { font-size: clamp(1.25rem, 3vw, 1.75rem); }
h3 { font-size: 1.05rem; }
p  { margin: 0 0 .8em; }
a  { color: var(--teal); }

.screen {
  max-width: 1080px;
  margin: 0 auto;
  padding: 18px 16px 72px;
}

/* ------------------------------ HUD ------------------------------------ */

.hud {
  position: sticky;
  top: 0;
  z-index: 40;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 8px 14px;
  background: rgba(9, 14, 24, .92);
  border-bottom: 1px solid var(--line);
  backdrop-filter: blur(8px);
}

.hud__home {
  background: var(--panel-2);
  color: var(--ink);
  border: 1px solid var(--line);
  border-radius: 9px;
  padding: 7px 12px;
  font: inherit;
  font-size: .85rem;
  cursor: pointer;
}
.hud__home:hover { border-color: var(--teal); color: var(--teal); }

.hud__id { display: flex; flex-direction: column; line-height: 1.15; min-width: 0; }
.hud__rank { font-size: .68rem; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); }
.hud__name { font-size: .9rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.hud__xpwrap { flex: 1; display: flex; align-items: center; gap: 8px; min-width: 60px; }
.hud__xpbar { flex: 1; height: 8px; background: var(--panel-2); border-radius: 99px; overflow: hidden; border: 1px solid var(--line); }
.hud__xpfill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--teal-dark), var(--teal)); transition: width .45s ease; }
.hud__xptext { font: 600 .78rem var(--mono); color: var(--ink-dim); white-space: nowrap; }

.hud__lives { font-size: 1rem; letter-spacing: .08em; color: var(--gold); white-space: nowrap; }

/* ------------------------------ Cards ---------------------------------- */

.panel {
  background: linear-gradient(180deg, var(--panel), var(--bg-2));
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 18px;
  box-shadow: var(--shadow);
  margin-bottom: 16px;
}

.panel--flush { padding: 0; overflow: hidden; }

.eyebrow {
  font-size: .7rem;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: var(--teal);
  font-weight: 700;
  margin-bottom: 6px;
}

.muted { color: var(--ink-dim); }
.small { font-size: .85rem; }
.mono  { font-family: var(--mono); }
.center{ text-align: center; }

/* ------------------------------ Buttons -------------------------------- */

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  background: var(--panel-2);
  color: var(--ink);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 11px 18px;
  font: 600 .95rem var(--sans);
  cursor: pointer;
  transition: transform .08s ease, border-color .15s ease, background .15s ease;
}
.btn:hover:not(:disabled) { border-color: var(--teal); background: #1b2c47; }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { opacity: .45; cursor: not-allowed; }

.btn--primary {
  background: linear-gradient(180deg, var(--teal), var(--teal-dark));
  color: #04231f;
  border-color: transparent;
  font-weight: 700;
}
.btn--primary:hover:not(:disabled) { background: linear-gradient(180deg, #4ce6d4, #1a9384); }

.btn--gold { background: linear-gradient(180deg, var(--gold), #d9932a); color: #241703; border-color: transparent; font-weight: 700; }
.btn--ghost { background: transparent; }
.btn--sm { padding: 7px 12px; font-size: .82rem; }
.btn--wide { width: 100%; }

.btn-row { display: flex; flex-wrap: wrap; gap: 10px; }

/* ------------------------------ Title screen --------------------------- */

.title { text-align: center; padding: 6vh 0 2vh; }
.title__logo {
  font-size: clamp(2.2rem, 8vw, 4.2rem);
  font-weight: 800;
  letter-spacing: .04em;
  background: linear-gradient(92deg, var(--teal), var(--violet) 55%, var(--gold));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  margin-bottom: 4px;
}
.title__sub { color: var(--ink-dim); font-size: 1.02rem; margin-bottom: 26px; }

.title__card { max-width: 560px; margin: 0 auto; text-align: left; }

.field { display: block; margin-bottom: 14px; }
.field > span { display: block; font-size: .78rem; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-dim); margin-bottom: 6px; }
.field input, .field select {
  width: 100%;
  background: var(--bg);
  color: var(--ink);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 11px 13px;
  font: 500 1rem var(--sans);
}
.field input:focus, .field select:focus { outline: 2px solid var(--teal); outline-offset: 1px; }

/* ------------------------------ Mission map ---------------------------- */

.map-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 14px;
}

.zone-card {
  position: relative;
  display: flex;
  flex-direction: column;
  text-align: left;
  background: linear-gradient(160deg, var(--panel), var(--bg-2));
  border: 1px solid var(--line);
  border-left: 4px solid var(--accent, var(--teal));
  border-radius: var(--radius);
  padding: 16px;
  cursor: pointer;
  font: inherit;
  color: inherit;
  transition: transform .12s ease, border-color .15s ease, box-shadow .15s ease;
}
.zone-card:hover:not(:disabled) { transform: translateY(-3px); box-shadow: var(--shadow); border-color: var(--accent, var(--teal)); }
.zone-card:disabled { opacity: .5; cursor: not-allowed; }

.zone-card__tag { font: 700 .68rem var(--mono); letter-spacing: .16em; color: var(--accent, var(--teal)); text-transform: uppercase; }
.zone-card__name { font-size: 1.22rem; font-weight: 700; margin: 4px 0 2px; }
.zone-card__sub { font-size: .86rem; color: var(--ink-dim); margin-bottom: 10px; }
.zone-card__skills { font-size: .78rem; color: var(--ink-dim); margin-bottom: 12px; }
.zone-card__foot { margin-top: auto; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.zone-card__stars { color: var(--gold); letter-spacing: .1em; font-size: 1rem; }
.zone-card__best { font: 600 .76rem var(--mono); color: var(--ink-dim); }
.zone-card__lock { position: absolute; top: 14px; right: 14px; font-size: 1.1rem; }

/* ------------------------------ Game stage ----------------------------- */

.stage {
  display: grid;
  grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr);
  gap: 16px;
  align-items: start;
}
@media (max-width: 820px) { .stage { grid-template-columns: 1fr; } }

.canvas-wrap {
  position: relative;
  background: #050a12;
  border: 1px solid var(--line);
  border-radius: var(--radius);
  overflow: hidden;
}
canvas { display: block; width: 100%; height: auto; touch-action: manipulation; }

.readout {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(118px, 1fr));
  gap: 8px;
  margin-top: 12px;
}
.readout__cell {
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 9px;
  padding: 8px 10px;
}
.readout__k { display: block; font-size: .65rem; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-dim); }
.readout__v { display: block; font: 700 .95rem var(--mono); color: var(--teal); white-space: nowrap; }

/* ------------------------------ Questions ------------------------------ */

.q__stem { font-size: 1.04rem; margin-bottom: 12px; }
.q__stem code { background: var(--bg); padding: 1px 5px; border-radius: 5px; font-family: var(--mono); }

.opts { display: grid; gap: 9px; }
.opt {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  text-align: left;
  background: var(--bg);
  color: var(--ink);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 11px 13px;
  font: 500 .95rem var(--sans);
  cursor: pointer;
  transition: border-color .12s ease, background .12s ease;
}
.opt:hover:not(:disabled) { border-color: var(--teal); }
.opt:disabled { cursor: default; }
.opt__key {
  flex: none;
  width: 24px; height: 24px;
  display: grid; place-items: center;
  border-radius: 6px;
  background: var(--panel-2);
  font: 700 .8rem var(--mono);
  color: var(--ink-dim);
}
.opt--right { border-color: var(--green); background: rgba(92,224,138,.10); }
.opt--right .opt__key { background: var(--green); color: #04240f; }
.opt--wrong { border-color: var(--rose); background: rgba(255,107,129,.10); }
.opt--wrong .opt__key { background: var(--rose); color: #2b0509; }

.feedback {
  margin-top: 12px;
  border-radius: 10px;
  padding: 12px 14px;
  border: 1px solid var(--line);
  background: var(--bg);
  font-size: .92rem;
}
.feedback--right { border-color: var(--green); }
.feedback--wrong { border-color: var(--gold); }
.feedback__title { font-weight: 700; margin-bottom: 4px; }
.feedback--right .feedback__title { color: var(--green); }
.feedback--wrong .feedback__title { color: var(--gold); }
.feedback__work { font-family: var(--mono); font-size: .85rem; color: var(--ink-dim); white-space: pre-wrap; margin-top: 6px; }

.numin {
  display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
}
.numin input {
  flex: 1 1 130px;
  background: var(--bg); color: var(--ink);
  border: 1px solid var(--line); border-radius: 10px;
  padding: 11px 13px; font: 600 1rem var(--mono);
}
.numin input:focus { outline: 2px solid var(--teal); outline-offset: 1px; }
.numin__unit { font: 600 .95rem var(--mono); color: var(--ink-dim); }

/* ------------------------------ Sliders -------------------------------- */

.ctrl { margin-bottom: 14px; }
.ctrl__head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 4px; }
.ctrl__label { font-size: .8rem; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-dim); }
.ctrl__val { font: 700 .95rem var(--mono); color: var(--gold); }

input[type="range"] {
  -webkit-appearance: none; appearance: none;
  width: 100%; height: 26px; background: transparent; cursor: pointer; margin: 0;
}
input[type="range"]::-webkit-slider-runnable-track { height: 6px; background: var(--panel-2); border-radius: 99px; border: 1px solid var(--line); }
input[type="range"]::-moz-range-track { height: 6px; background: var(--panel-2); border-radius: 99px; border: 1px solid var(--line); }
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 20px; height: 20px; border-radius: 50%;
  background: var(--teal); border: 2px solid #04231f; margin-top: -8px;
}
input[type="range"]::-moz-range-thumb { width: 20px; height: 20px; border-radius: 50%; background: var(--teal); border: 2px solid #04231f; }

/* ------------------------------ Misc ----------------------------------- */

.chips { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 12px; }
.chip {
  font: 600 .74rem var(--mono);
  background: var(--panel-2);
  border: 1px solid var(--line);
  color: var(--ink-dim);
  border-radius: 99px;
  padding: 4px 10px;
}
.chip--on { border-color: var(--teal); color: var(--teal); }
.chip--gold { border-color: var(--gold); color: var(--gold); }

.progress-dots { display: flex; gap: 6px; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--panel-2); border: 1px solid var(--line); }
.dot--done { background: var(--teal); border-color: var(--teal); }
.dot--miss { background: var(--rose); border-color: var(--rose); }
.dot--now  { box-shadow: 0 0 0 3px rgba(47,214,195,.25); }

table.data { width: 100%; border-collapse: collapse; font-size: .9rem; }
table.data th, table.data td { text-align: left; padding: 7px 9px; border-bottom: 1px solid var(--line); }
table.data th { font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-dim); font-weight: 700; }
table.data td.num { font-family: var(--mono); }

ul.tight { margin: 0 0 .8em; padding-left: 1.1em; }
ul.tight li { margin-bottom: .3em; }

/* ------------------------------ Toast ---------------------------------- */

.toast {
  position: fixed;
  left: 50%;
  bottom: 24px;
  transform: translate(-50%, 18px);
  background: var(--panel-2);
  border: 1px solid var(--teal);
  color: var(--ink);
  padding: 10px 18px;
  border-radius: 99px;
  font-weight: 600;
  font-size: .92rem;
  box-shadow: var(--shadow);
  opacity: 0;
  pointer-events: none;
  transition: opacity .25s ease, transform .25s ease;
  z-index: 60;
  max-width: 90vw;
  text-align: center;
}
.toast--on { opacity: 1; transform: translate(-50%, 0); }

/* ------------------------------ Modal ---------------------------------- */

.modal {
  position: fixed; inset: 0; z-index: 70;
  background: rgba(4, 7, 13, .78);
  display: grid; place-items: center;
  padding: 18px;
  backdrop-filter: blur(4px);
}
.modal[hidden] { display: none; }
.modal__box {
  width: min(560px, 100%);
  max-height: 88vh;
  overflow-y: auto;
  background: linear-gradient(180deg, var(--panel), var(--bg-2));
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 22px;
  box-shadow: var(--shadow);
}
.modal__actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }

.stars-big { font-size: 2rem; color: var(--gold); letter-spacing: .12em; text-align: center; margin: 6px 0 14px; }

/* ------------------------------ Badges --------------------------------- */

.badge-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.badge {
  background: var(--bg); border: 1px solid var(--line); border-radius: 10px;
  padding: 10px 12px; font-size: .82rem;
}
.badge--on { border-color: var(--gold); }
.badge__icon { font-size: 1.3rem; display: block; margin-bottom: 2px; filter: grayscale(1) opacity(.45); }
.badge--on .badge__icon { filter: none; }
.badge__name { display: block; font-weight: 700; line-height: 1.25; }
.badge__desc { display: block; color: var(--ink-dim); font-size: .75rem; margin-top: 2px; }

/* ------------------------------ Helpers -------------------------------- */

.row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.spread { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.mt { margin-top: 14px; }
.mb0 { margin-bottom: 0; }
.nowrap { white-space: nowrap; }

@media (prefers-reduced-motion: reduce) {
  * { animation-duration: .001ms !important; transition-duration: .001ms !important; }
}

</style>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>🚀</text></svg>">

<body>

<header id="hud" class="hud" hidden>
  <button class="hud__home" data-nav="map" title="Mission map">◀ Map</button>
  <div class="hud__id">
    <span class="hud__rank" id="hudRank">Cadet</span>
    <span class="hud__name" id="hudName">Pilot</span>
  </div>
  <div class="hud__xpwrap">
    <div class="hud__xpbar"><div class="hud__xpfill" id="hudXpFill"></div></div>
    <span class="hud__xptext" id="hudXpText">0 XP</span>
  </div>
  <div class="hud__lives" id="hudStars">☆☆☆☆☆</div>
</header>

<main id="screen" class="screen"></main>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<!-- Modal used for debriefs, misconception cards and zone results -->
<div id="modal" class="modal" hidden>
  <div class="modal__box" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <h2 id="modalTitle"></h2>
    <div id="modalBody"></div>
    <div id="modalActions" class="modal__actions"></div>
  </div>
</div>

<script>
/* ==========================================================================
   engine.js — save state, progression, routing.
   Everything the player earns lives in one object persisted to localStorage.
   ========================================================================== */

const Game = (() => {
  'use strict';

  const SAVE_KEY = 'vector-rescue.save.v1';

  const RANKS = [
    { xp: 0,    name: 'Cadet' },
    { xp: 350,  name: 'Pilot 3rd Class' },
    { xp: 800,  name: 'Pilot 2nd Class' },
    { xp: 1400, name: 'Pilot 1st Class' },
    { xp: 2100, name: 'Flight Officer' },
    { xp: 3000, name: 'Rescue Commander' }
  ];

  /* Badges are awarded for beating a named misconception from the decks,
     so a student can see exactly which wrong idea they have retired. */
  const BADGES = {
    pathfinder:   { icon: '🧭', name: 'Pathfinder',    desc: 'Distance is path length; displacement is the change in position.' },
    signmaster:   { icon: '±',  name: 'Sign Master',   desc: 'Negative acceleration means "towards negative", not "slowing down".' },
    gradient:     { icon: '📈', name: 'Gradient Eye',  desc: 'Read velocity from a tangent, not from value ÷ time.' },
    areahunter:   { icon: '🔷', name: 'Area Hunter',   desc: 'Area under v–t is displacement; below the axis counts negative.' },
    chooser:      { icon: '🎛️', name: 'Equation Picker', desc: 'Pick the suvat equation that leaves out the quantity you do not have.' },
    topofflight:  { icon: '🔝', name: 'Top of Flight', desc: 'At the highest point v = 0 but a = g downwards.' },
    independence: { icon: '🎯', name: 'Independence',  desc: 'Horizontal and vertical motion are independent.' },
    terminal:     { icon: '🪂', name: 'Terminal',      desc: 'At terminal speed forces balance — the resultant force is zero.' },
    dragaware:    { icon: '🌬️', name: 'Drag Aware',    desc: 'With drag: lower peak, shorter range, asymmetric path.' },
    commander:    { icon: '🎖️', name: 'Commander',     desc: 'Cleared Mission Alpha, the full A.1 rescue exam.' }
  };

  const defaultSave = () => ({
    name: 'Pilot',
    xp: 0,
    zones: {},          // id -> { stars, best, cleared }
    badges: {},         // id -> true
    seen: {},           // misconception cards already shown
    totalCorrect: 0,
    totalAnswered: 0
  });

  let save = defaultSave();

  /* ------------------------------ persistence --------------------------- */

  function load() {
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (raw) save = Object.assign(defaultSave(), JSON.parse(raw));
    } catch (err) {
      // Private browsing or blocked storage: play on with an in-memory save.
      save = defaultSave();
    }
    return save;
  }

  function persist() {
    try {
      localStorage.setItem(SAVE_KEY, JSON.stringify(save));
    } catch (err) { /* storage unavailable — progress stays for this session */ }
  }

  function reset() {
    save = defaultSave();
    persist();
  }

  /* ------------------------------ progression --------------------------- */

  function rank() {
    let r = RANKS[0];
    for (const candidate of RANKS) if (save.xp >= candidate.xp) r = candidate;
    return r;
  }

  function nextRank() {
    return RANKS.find(r => r.xp > save.xp) || null;
  }

  function addXp(amount) {
    const before = rank().name;
    save.xp = Math.max(0, save.xp + amount);
    persist();
    const after = rank().name;
    if (after !== before) UI.toast(`Promoted to ${after}!`, 2600);
    UI.syncHud();
    return save.xp;
  }

  function awardBadge(id) {
    if (!BADGES[id] || save.badges[id]) return false;
    save.badges[id] = true;
    persist();
    UI.toast(`${BADGES[id].icon} Badge unlocked — ${BADGES[id].name}`, 3000);
    return true;
  }

  function recordAnswer(correct) {
    save.totalAnswered++;
    if (correct) save.totalCorrect++;
    persist();
  }

  /** Stars are a 0–5 rating of a zone run; only an improvement is stored. */
  function finishZone(zoneId, { stars, score }) {
    const prev = save.zones[zoneId] || { stars: 0, best: 0, cleared: false };
    save.zones[zoneId] = {
      stars: Math.max(prev.stars, stars),
      best: Math.max(prev.best, score),
      cleared: prev.cleared || stars > 0
    };
    persist();
    UI.syncHud();
    return save.zones[zoneId];
  }

  function zoneState(zoneId) {
    return save.zones[zoneId] || { stars: 0, best: 0, cleared: false };
  }

  function totalStars() {
    return Object.values(save.zones).reduce((sum, z) => sum + (z.stars || 0), 0);
  }

  /** A zone unlocks when the one before it has been cleared. */
  function isUnlocked(zone, allZones) {
    if (!zone.requires) return true;
    return zone.requires.every(id => zoneState(id).cleared);
  }

  /* ------------------------------ routing ------------------------------- */

  const routes = {};
  let current = null;

  function route(name, renderFn) { routes[name] = renderFn; }

  function go(name, params) {
    const render = routes[name];
    if (!render) { console.warn('No route:', name); return; }
    current = name;
    if (typeof Zone !== 'undefined') Zone.stopAll();
    const screen = document.getElementById('screen');
    screen.innerHTML = '';
    document.getElementById('hud').hidden = (name === 'title');
    window.scrollTo(0, 0);
    render(screen, params || {});
    UI.syncHud();
  }

  return {
    BADGES, RANKS,
    load, persist, reset,
    get save() { return save; },
    rank, nextRank, addXp, awardBadge, recordAnswer,
    finishZone, zoneState, totalStars, isUnlocked,
    route, go,
    get current() { return current; }
  };
})();

</script>
<script>
/* ==========================================================================
   ui.js — DOM helpers, HUD sync, toasts, modals and the shared question card.
   Every zone asks questions through UI.ask() so feedback is consistent.
   ========================================================================== */

const UI = (() => {
  'use strict';

  /* ------------------------------ DOM helpers --------------------------- */

  /** el('div.panel', {id:'x'}, child, 'text') — tiny hyperscript. */
  function el(spec, attrs, ...children) {
    const [tagPart, ...classes] = String(spec).split('.');
    const node = document.createElement(tagPart || 'div');
    if (classes.length) node.className = classes.join(' ');
    if (attrs && typeof attrs === 'object' && !(attrs instanceof Node) && !Array.isArray(attrs)) {
      for (const [k, v] of Object.entries(attrs)) {
        if (v === null || v === undefined || v === false) continue;
        if (k === 'html') node.innerHTML = v;
        else if (k === 'text') node.textContent = v;
        else if (k.startsWith('on') && typeof v === 'function') node.addEventListener(k.slice(2).toLowerCase(), v);
        else if (k === 'style' && typeof v === 'object') Object.assign(node.style, v);
        else node.setAttribute(k, v === true ? '' : v);
      }
    } else if (attrs !== undefined && attrs !== null) {
      children.unshift(attrs);
    }
    for (const child of children.flat()) {
      if (child === null || child === undefined || child === false) continue;
      node.append(child instanceof Node ? child : document.createTextNode(String(child)));
    }
    return node;
  }

  const $ = (sel, root) => (root || document).querySelector(sel);

  /* ------------------------------ HUD ----------------------------------- */

  function syncHud() {
    const rank = Game.rank();
    const next = Game.nextRank();
    $('#hudRank').textContent = rank.name;
    $('#hudName').textContent = Game.save.name;
    $('#hudXpText').textContent = `${Game.save.xp} XP`;
    const floor = rank.xp;
    const ceil = next ? next.xp : rank.xp + 1;
    const pct = next ? ((Game.save.xp - floor) / (ceil - floor)) * 100 : 100;
    $('#hudXpFill').style.width = `${Math.max(3, Math.min(100, pct))}%`;
    $('#hudStars').textContent = stars(Math.min(5, Math.round(Game.totalStars() / 5)), 5);
  }

  function stars(filled, total) {
    return '★'.repeat(Math.max(0, filled)) + '☆'.repeat(Math.max(0, total - filled));
  }

  /* ------------------------------ Toast --------------------------------- */

  let toastTimer = null;
  function toast(message, ms) {
    const node = $('#toast');
    node.textContent = message;
    node.classList.add('toast--on');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => node.classList.remove('toast--on'), ms || 1800);
  }

  /* ------------------------------ Modal --------------------------------- */

  /** actions: [{ label, primary, onClick }] — onClick runs after the close. */
  function modal(title, bodyNode, actions) {
    const box = $('#modal');
    $('#modalTitle').textContent = title;
    const body = $('#modalBody');
    body.innerHTML = '';
    body.append(bodyNode instanceof Node ? bodyNode : el('p', { html: String(bodyNode) }));
    const bar = $('#modalActions');
    bar.innerHTML = '';
    (actions || [{ label: 'Continue', primary: true }]).forEach(a => {
      bar.append(el('button.btn' + (a.primary ? '.btn--primary' : ''), {
        type: 'button',
        onClick: () => { closeModal(); if (a.onClick) a.onClick(); }
      }, a.label));
    });
    box.hidden = false;
  }

  function closeModal() { $('#modal').hidden = true; }

  /* ------------------------------ Controls ------------------------------ */

  /** A labelled slider that reports its live value. Returns {wrap, input}. */
  function slider({ label, min, max, step, value, unit, format, onInput }) {
    const val = el('span.ctrl__val');
    const input = el('input', { type: 'range', min, max, step, value });
    const show = () => {
      const v = parseFloat(input.value);
      val.textContent = (format ? format(v) : v) + (unit ? ` ${unit}` : '');
    };
    input.addEventListener('input', () => { show(); if (onInput) onInput(parseFloat(input.value)); });
    show();
    const wrap = el('div.ctrl', null,
      el('div.ctrl__head', null, el('span.ctrl__label', null, label), val),
      input
    );
    return { wrap, input, get value() { return parseFloat(input.value); } };
  }

  function readout(cells) {
    const wrap = el('div.readout');
    const refs = {};
    for (const [key, spec] of Object.entries(cells)) {
      const v = el('span.readout__v', null, spec.value !== undefined ? spec.value : '—');
      refs[key] = v;
      wrap.append(el('div.readout__cell', null, el('span.readout__k', null, spec.label), v));
    }
    return { wrap, set: (key, text) => { if (refs[key]) refs[key].textContent = text; } };
  }

  function dots(total, stateFn) {
    const wrap = el('div.progress-dots');
    for (let i = 0; i < total; i++) {
      const s = stateFn ? stateFn(i) : '';
      wrap.append(el('span.dot' + (s ? '.dot--' + s : '')));
    }
    return wrap;
  }

  /* ------------------------------ Question card -------------------------- */

  /**
   * Render one question and resolve with { correct, question }.
   *   mcq: { type:'mcq', stem, options:[{text, why}], answer, work, badge }
   *   num: { type:'num', stem, answer, unit, tol, work, badge, hint }
   * `tol` is a relative tolerance (default 2%), with an absolute floor so
   * answers near zero still work.
   */
  function ask(container, q, onDone) {
    container.innerHTML = '';
    const card = el('div');
    card.append(el('div.q__stem', { html: q.stem }));

    const feedbackSlot = el('div');
    let answered = false;

    const settle = (correct, chosenWhy) => {
      if (answered) return;
      answered = true;
      Game.recordAnswer(correct);
      if (correct && q.badge) Game.awardBadge(q.badge);

      const fb = el('div.feedback' + (correct ? '.feedback--right' : '.feedback--wrong'));
      fb.append(el('div.feedback__title', null, correct ? '✓ Correct' : '✗ Not quite'));
      if (!correct && chosenWhy) fb.append(el('div', { html: chosenWhy }));
      if (q.work) fb.append(el('div.feedback__work', null, q.work));
      feedbackSlot.append(fb);

      const next = el('button.btn.btn--primary.mt', {
        type: 'button',
        onClick: () => onDone({ correct, question: q })
      }, 'Continue ▶');
      feedbackSlot.append(next);
      next.focus();
    };

    if (q.type === 'num') {
      const input = el('input', {
        type: 'text', inputmode: 'decimal', placeholder: 'your answer',
        'aria-label': 'Answer'
      });
      const check = () => {
        const given = parseFloat(String(input.value).replace(/[^0-9eE+\-.]/g, ''));
        if (!isFinite(given)) { toast('Type a number first'); return; }
        const tol = q.tol !== undefined ? q.tol : 0.02;
        const slack = Math.max(Math.abs(q.answer) * tol, Math.abs(q.answer) * 0.005 + 1e-9, q.absTol || 0);
        const correct = Math.abs(given - q.answer) <= slack;
        input.disabled = true; goBtn.disabled = true;
        settle(correct, `The accepted answer is <strong>${Physics.sig(q.answer, 3)} ${q.unit || ''}</strong>.`);
      };
      const goBtn = el('button.btn.btn--primary', { type: 'button', onClick: check }, 'Check');
      input.addEventListener('keydown', e => { if (e.key === 'Enter') check(); });
      card.append(el('div.numin', null, input, q.unit ? el('span.numin__unit', null, q.unit) : null, goBtn));
      if (q.hint) card.append(el('p.small.muted.mt', { html: `Hint: ${q.hint}` }));
      setTimeout(() => input.focus(), 30);
    } else {
      const opts = el('div.opts');
      q.options.forEach((opt, i) => {
        const btn = el('button.opt', { type: 'button' },
          el('span.opt__key', null, 'ABCD'[i] || String(i + 1)),
          el('span', { html: opt.text })
        );
        btn.addEventListener('click', () => {
          if (answered) return;
          const correct = i === q.answer;
          [...opts.children].forEach((child, j) => {
            child.disabled = true;
            if (j === q.answer) child.classList.add('opt--right');
            else if (j === i) child.classList.add('opt--wrong');
          });
          settle(correct, opt.why);
        });
        opts.append(btn);
      });
      card.append(opts);
    }

    card.append(feedbackSlot);
    container.append(card);
  }

  /* ------------------------------ Canvas -------------------------------- */

  /**
   * A crisp canvas sized in CSS pixels; the context is pre-scaled for the
   * device pixel ratio so 1 unit of drawing = 1 CSS pixel.
   */
  function canvas(width, height) {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const cnv = el('canvas', { width: Math.round(width * dpr), height: Math.round(height * dpr) });
    cnv.style.aspectRatio = `${width} / ${height}`;
    const ctx = cnv.getContext('2d');
    ctx.scale(dpr, dpr);
    cnv.logicalWidth = width;
    cnv.logicalHeight = height;
    return { cnv, ctx, w: width, h: height };
  }

  return { el, $, syncHud, stars, toast, modal, closeModal, slider, readout, dots, ask, canvas };
})();

</script>
<script>
/* ==========================================================================
   physics.js — the one place the physics lives.
   Every zone calls into here, so a student who checks a number against the
   deck gets the same answer the game used.  g = 9.81 m s⁻² throughout,
   as stated on slide 1 of both decks.
   ========================================================================== */

const Physics = (() => {
  'use strict';

  const G = 9.81;

  /* ------------------------------ formatting ---------------------------- */

  /** Round to n significant figures and print without trailing noise. */
  function sig(x, n) {
    if (!isFinite(x)) return '—';
    if (x === 0) return '0';
    const digits = n || 3;
    const rounded = Number(x.toPrecision(digits));
    if (Math.abs(rounded) >= 1e5 || (Math.abs(rounded) < 1e-3 && rounded !== 0)) {
      return rounded.toExponential(digits - 1).replace('e', ' × 10^');
    }
    return String(rounded);
  }

  const fix = (x, n) => (isFinite(x) ? x.toFixed(n === undefined ? 1 : n) : '—');
  const rad = deg => (deg * Math.PI) / 180;
  const deg = r => (r * 180) / Math.PI;

  /* ------------------------------ vectors ------------------------------- */

  const mag = (x, y) => Math.hypot(x, y);

  /** Direction of (x, y) in degrees above the +x axis, in (-180, 180]. */
  const dir = (x, y) => deg(Math.atan2(y, x));

  /** Resolve a vector given magnitude and angle above the horizontal. */
  const resolve = (m, angleDeg) => ({ x: m * Math.cos(rad(angleDeg)), y: m * Math.sin(rad(angleDeg)) });

  /* ------------------------------ suvat --------------------------------- */

  /* The four equations of motion, exactly as the data booklet lists them.
     Each takes the three quantities it needs and returns the fourth. */
  const suvat = {
    // s = ((u + v) / 2) t        — the one with no a
    sFromUVt: (u, v, t) => ((u + v) / 2) * t,
    // v = u + at                 — the one with no s
    vFromUAt: (u, a, t) => u + a * t,
    // s = ut + ½at²              — the one with no v
    sFromUAt: (u, a, t) => u * t + 0.5 * a * t * t,
    // v² = u² + 2as              — the one with no t
    vFromUAs: (u, a, s) => {
      const vsq = u * u + 2 * a * s;
      return vsq < 0 ? NaN : Math.sqrt(vsq);
    }
  };

  /**
   * Positive root of s = ut + ½at² for t, i.e. the time to reach
   * displacement s starting at u with uniform acceleration a.
   * Returns NaN when the displacement is never reached.
   */
  function timeToDisplacement(s, u, a) {
    if (Math.abs(a) < 1e-12) return Math.abs(u) < 1e-12 ? NaN : s / u;
    const disc = u * u + 2 * a * s;
    if (disc < 0) return NaN;
    const root = Math.sqrt(disc);
    const t1 = (-u + root) / a;
    const t2 = (-u - root) / a;
    const valid = [t1, t2].filter(t => t > 1e-9).sort((p, q) => p - q);
    return valid.length ? valid[0] : NaN;
  }

  /* ------------------------------ projectiles (no drag) ------------------ */

  /**
   * Analytic projectile launched at speed u, angle θ above the horizontal,
   * from height h above the landing plane.  Up is positive.
   */
  function projectile(u, angleDeg, h) {
    const height = h || 0;
    const { x: ux, y: uy } = resolve(u, angleDeg);
    // Landing: vertical displacement of -height relative to launch.
    const tFlight = timeToDisplacement(-height, uy, -G);
    const apex = uy > 0 ? (uy * uy) / (2 * G) : 0;       // above the launch point
    return {
      ux, uy,
      timeOfFlight: tFlight,
      range: ux * tFlight,
      maxHeight: height + apex,        // above the ground
      apexAboveLaunch: apex,
      timeToApex: uy > 0 ? uy / G : 0,
      landingSpeed: Math.hypot(ux, uy + -G * tFlight),
      landingAngle: dir(ux, uy - G * tFlight),
      at(t) {
        return {
          x: ux * t,
          y: height + uy * t - 0.5 * G * t * t,
          vx: ux,
          vy: uy - G * t
        };
      }
    };
  }

  /** Sampled flight path, for drawing. */
  function trajectory(u, angleDeg, h, samples) {
    const p = projectile(u, angleDeg, h);
    const n = samples || 90;
    const pts = [];
    for (let i = 0; i <= n; i++) {
      const s = p.at((p.timeOfFlight * i) / n);
      pts.push({ x: s.x, y: s.y, t: (p.timeOfFlight * i) / n, vx: s.vx, vy: s.vy });
    }
    return { path: pts, summary: p };
  }

  /* ------------------------------ fluid resistance ----------------------- */

  /*
   * Drag is modelled as quadratic in speed and opposite to the velocity:
   *     F_drag = -k |v| v,        a_drag = -(k/m) |v| v
   * Rather than ask a student for k, the model is parameterised by the
   * terminal speed vT, because at terminal speed drag balances weight:
   *     k/m = g / vT²
   * so a heavier or more streamlined body simply has a larger vT — exactly
   * the story the deck tells in S5.
   */

  function dragCoefficient(terminalSpeed) {
    return terminalSpeed > 0 ? G / (terminalSpeed * terminalSpeed) : 0;
  }

  /** Acceleration of a body at velocity (vx, vy) with drag parameter c = k/m. */
  function accelWithDrag(vx, vy, c) {
    const speed = Math.hypot(vx, vy);
    return { ax: -c * speed * vx, ay: -G - c * speed * vy };
  }

  /** One RK4 step of the 2D drag equations. Up is positive. */
  function stepDrag(state, dt, c) {
    const deriv = s => {
      const a = accelWithDrag(s.vx, s.vy, c);
      return { x: s.vx, y: s.vy, vx: a.ax, vy: a.ay };
    };
    const add = (s, d, f) => ({
      x: s.x + d.x * f, y: s.y + d.y * f, vx: s.vx + d.vx * f, vy: s.vy + d.vy * f
    });
    const k1 = deriv(state);
    const k2 = deriv(add(state, k1, dt / 2));
    const k3 = deriv(add(state, k2, dt / 2));
    const k4 = deriv(add(state, k3, dt));
    return {
      x:  state.x  + (dt / 6) * (k1.x  + 2 * k2.x  + 2 * k3.x  + k4.x),
      y:  state.y  + (dt / 6) * (k1.y  + 2 * k2.y  + 2 * k3.y  + k4.y),
      vx: state.vx + (dt / 6) * (k1.vx + 2 * k2.vx + 2 * k3.vx + k4.vx),
      vy: state.vy + (dt / 6) * (k1.vy + 2 * k2.vy + 2 * k3.vy + k4.vy)
    };
  }

  /**
   * Full flight with drag, from launch to the moment y returns to 0.
   * terminalSpeed = 0 reproduces the vacuum case exactly.
   */
  function dragFlight(u, angleDeg, h, terminalSpeed, dt) {
    const c = dragCoefficient(terminalSpeed);
    const { x: ux, y: uy } = resolve(u, angleDeg);
    const step = dt || 0.002;
    let s = { x: 0, y: h || 0, vx: ux, vy: uy };
    const path = [{ x: s.x, y: s.y, t: 0, vx: s.vx, vy: s.vy }];
    let t = 0, maxHeight = s.y, guard = 0;

    while (guard++ < 200000) {
      const next = stepDrag(s, step, c);
      t += step;
      if (next.y > maxHeight) maxHeight = next.y;
      if (next.y <= 0 && s.y > 0) {
        // Linear interpolation onto the ground for a clean landing point.
        const f = s.y / (s.y - next.y);
        const land = {
          x: s.x + (next.x - s.x) * f,
          y: 0,
          t: t - step + step * f,
          vx: s.vx + (next.vx - s.vx) * f,
          vy: s.vy + (next.vy - s.vy) * f
        };
        path.push(land);
        return {
          path,
          range: land.x,
          timeOfFlight: land.t,
          maxHeight,
          landingSpeed: Math.hypot(land.vx, land.vy),
          landingAngle: dir(land.vx, land.vy)
        };
      }
      s = next;
      path.push({ x: s.x, y: s.y, t, vx: s.vx, vy: s.vy });
    }
    return { path, range: s.x, timeOfFlight: t, maxHeight, landingSpeed: Math.hypot(s.vx, s.vy), landingAngle: dir(s.vx, s.vy) };
  }

  /* ------------------------------ graph areas ---------------------------- */

  /**
   * Signed area under a piecewise-linear velocity–time graph, i.e. the
   * displacement.  Points are [{t, v}, ...] in increasing t.
   */
  function areaUnder(points) {
    let area = 0;
    for (let i = 1; i < points.length; i++) {
      const dt = points[i].t - points[i - 1].t;
      area += ((points[i].v + points[i - 1].v) / 2) * dt;
    }
    return area;
  }

  /** Total path length, i.e. the distance: areas below the axis count positive. */
  function distanceUnder(points) {
    let total = 0;
    for (let i = 1; i < points.length; i++) {
      const [t0, v0] = [points[i - 1].t, points[i - 1].v];
      const [t1, v1] = [points[i].t, points[i].v];
      const dt = t1 - t0;
      if (dt <= 0) continue;
      if (v0 * v1 >= 0) {
        total += Math.abs(((v0 + v1) / 2) * dt);
      } else {
        // The segment crosses the axis: split it at the zero crossing.
        const tc = dt * (Math.abs(v0) / (Math.abs(v0) + Math.abs(v1)));
        total += Math.abs(v0 * tc / 2) + Math.abs(v1 * (dt - tc) / 2);
      }
    }
    return total;
  }

  return {
    G, sig, fix, rad, deg, mag, dir, resolve,
    suvat, timeToDisplacement,
    projectile, trajectory,
    dragCoefficient, accelWithDrag, stepDrag, dragFlight,
    areaUnder, distanceUnder
  };
})();

/* ==========================================================================
   Zone — animation-loop registry so navigating away always stops the physics.
   ========================================================================== */

const Zone = (() => {
  'use strict';
  let handles = [];

  /** Run fn(dtSeconds, elapsedSeconds) each frame until the screen changes. */
  function loop(fn) {
    let last = performance.now();
    let start = last;
    let alive = true;
    const tick = now => {
      if (!alive) return;
      const dt = Math.min((now - last) / 1000, 0.05);   // clamp after a tab switch
      last = now;
      fn(dt, (now - start) / 1000);
      handle.raf = requestAnimationFrame(tick);
    };
    const handle = {
      raf: requestAnimationFrame(tick),
      stop() { alive = false; cancelAnimationFrame(this.raf); }
    };
    handles.push(handle);
    return handle;
  }

  function stopAll() {
    handles.forEach(h => h.stop());
    handles = [];
  }

  return { loop, stopAll };
})();

</script>
<script>
/* ==========================================================================
   questions.js — the question bank, taken from the two A.1 decks.
   The five HINGE questions and every "common misconception" row appear here,
   because those are the ideas the decks say to check before moving on.
   ========================================================================== */

const Questions = (() => {
  'use strict';

  const pick = arr => arr[Math.floor(Math.random() * arr.length)];

  /** Fisher–Yates, then take n. Leaves the source bank untouched. */
  function sample(arr, n) {
    const copy = arr.slice();
    for (let i = copy.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [copy[i], copy[j]] = [copy[j], copy[i]];
    }
    return copy.slice(0, Math.min(n, copy.length));
  }

  /* ------------------------------ S1: describing motion ------------------ */

  const s1 = [
    {
      type: 'mcq',
      tag: 'HINGE',
      badge: 'pathfinder',
      stem: 'A runner completes one <strong>full lap</strong> of a 400 m track in 80 s. What is her <strong>average velocity</strong>?',
      options: [
        { text: 'Zero' },
        { text: '5.0 m s⁻¹', why: 'That is her average <em>speed</em> — distance ÷ time. Velocity uses displacement.' },
        { text: '5.0 m s⁻¹ in the direction she faces at the finish', why: 'That uses the direction at one instant, not the average over the whole lap.' },
        { text: 'It cannot be found without a direction', why: 'Zero displacement gives zero velocity, and zero needs no direction.' }
      ],
      answer: 0,
      work: 'One full lap → she finishes where she started → displacement = 0.\naverage velocity = displacement ÷ time = 0 ÷ 80 = 0'
    },
    {
      type: 'mcq',
      badge: 'signmaster',
      stem: 'Take right as positive. A trolley moves <strong>left</strong> and has a <strong>positive</strong> acceleration. Is it speeding up or slowing down?',
      options: [
        { text: 'Slowing down' },
        { text: 'Speeding up', why: 'v is negative and a is positive — opposite signs, so the trolley is slowing.' },
        { text: 'Moving at constant speed', why: 'A non-zero acceleration always changes the velocity.' },
        { text: 'It reverses instantly', why: 'It slows first, and only then could it reverse.' }
      ],
      answer: 0,
      work: 'Same signs → speeding up.  Opposite signs → slowing down.\nHere v < 0 and a > 0, so the trolley slows down.'
    },
    {
      type: 'mcq',
      stem: 'Can the <strong>average speed</strong> of a journey ever be <strong>less than</strong> the magnitude of its average velocity?',
      options: [
        { text: 'No — distance ≥ |displacement|, and both are divided by the same time' },
        { text: 'Yes, if the object turns back on itself', why: 'Turning back makes the distance <em>larger</em>, so the average speed grows, not shrinks.' },
        { text: 'Yes, on a circular path', why: 'On a circle the distance is far larger than the displacement, so average speed is larger.' },
        { text: 'Only if the object stops part way', why: 'Stopping adds time to both, and never makes the distance smaller than the displacement.' }
      ],
      answer: 0,
      work: 'distance ≥ |displacement| always.\nThey are equal only for straight-line motion without turning back.'
    },
    {
      type: 'mcq',
      stem: "A car's speedometer reads 50 km h⁻¹. This reading is:",
      options: [
        { text: 'an instantaneous speed' },
        { text: 'an average speed', why: 'It shows the value at this moment, and it changes as the driver brakes.' },
        { text: 'an instantaneous velocity', why: 'The dial gives no direction, so it cannot be a velocity.' },
        { text: 'an average velocity', why: 'No direction and not averaged over the journey.' }
      ],
      answer: 0,
      work: '50 km h⁻¹ = 50 000 ÷ 3600 = 14 m s⁻¹, at this instant, with no direction given.'
    },
    {

<script>
/* ==========================================================================
   shell.js — the frame every zone runs inside: header, brief, step counter,
   score, and the end-of-zone debrief.  Zones are written as async functions

const Shell = (() => {
  'use strict';
  const el = UI.el;

  /** 0–5 stars from a fraction of the available marks. */
  function starsFor(score, max) {
    if (max <= 0) return 0;
    const pct = score / max;
    if (pct >= 0.95) return 5;
    if (pct >= 0.85) return 4;
    if (pct >= 0.70) return 3;
    if (pct >= 0.55) return 2;
    if (pct > 0)     return 1;
    return 0;
  }

  /**
   * Build the zone frame.  Returns a runner:
   *   run.brief(html)        — mission text under the title
   *   run.stage              — the element a step draws into
   *   run.side               — the right-hand column (controls, questions)
   *   run.setStep(i, n)      — progress dots
   *   run.award(points, max) — record marks as they are earned
   *   run.finish()           — show the debrief and save
   */
  function zone(root, meta) {
    const state = { score: 0, max: 0, step: 0, steps: meta.steps || 1 };

    const stepWrap = el('div');
    const head = el('div.panel', { style: { borderLeft: `4px solid ${meta.accent}` } },
      el('div.spread', null,
        el('div', null,
          el('div.eyebrow', { style: { color: meta.accent } }, meta.tag),
          el('h1', { style: { fontSize: '1.6rem', marginBottom: '2px' } }, meta.name),
          el('p.small.muted.mb0', null, meta.subtitle)
        ),
        stepWrap
      ),
      el('div', { id: 'zoneBrief' })
    );

    const stage = el('div');
    const side = el('div');
    const layout = el('div.stage', null, stage, side);

    root.append(head, layout);

    const scoreCell = el('span.chip.chip--gold', null, '0 marks');
    const setStep = (i, n) => {
      state.step = i; state.steps = n;
      stepWrap.innerHTML = '';
      stepWrap.append(el('div.row', null,
        el('span.small.muted', null, `Task ${Math.min(i + 1, n)} of ${n}`),
        UI.dots(n, k => (k < i ? 'done' : k === i ? 'now' : '')),
        scoreCell
      ));
    };
    setStep(0, state.steps);

    const run = {
      stage, side, meta, state,
      brief(html) {
        const node = UI.$('#zoneBrief', head);
        node.innerHTML = '';
        node.append(el('p.small.muted.mt.mb0', { html }));
      },
      setStep,
      award(points, max) {
        state.score += points;
        state.max += max;
        scoreCell.textContent = `${state.score} / ${state.max} marks`;
      },
      /** Replace the stage and side content for a new task. */
      clear() { stage.innerHTML = ''; side.innerHTML = ''; },
      finish() { return debrief(run); }
    };
    return run;
  }

  /** Ask a list of questions in the given container; resolves with marks won. */
  function askAll(container, questions, opts) {
    const options = opts || {};
    return new Promise(resolve => {
      let i = 0, correct = 0;
      const slot = el('div');
      const head = el('div.spread.mb0', null,
        el('div.eyebrow', null, options.title || 'Flight check'),
        UI.dots(questions.length, () => '')
      );
      container.append(el('div.panel', null, head, slot));

      const redraw = () => {
        head.lastChild.replaceWith(UI.dots(questions.length, k =>
          k < i ? (marks[k] ? 'done' : 'miss') : k === i ? 'now' : ''));
      };
      const marks = [];

      const next = () => {
        if (i >= questions.length) { resolve(correct); return; }
        redraw();
        const q = questions[i];
        UI.ask(slot, q, ({ correct: ok }) => {
          marks[i] = ok;
          if (ok) { correct++; Game.addXp(options.xp || 25); }
          i++;
          if (options.onAnswer) options.onAnswer(ok, i, questions.length);
          next();
        });
      };
      next();
    });
  }

  /** End-of-zone screen: stars, marks, XP bonus and what to revise. */
  function debrief(run) {
    return new Promise(resolve => {
      const { score, max } = run.state;
      const stars = starsFor(score, max);
      const prev = Game.zoneState(run.meta.id);
      const improved = stars > prev.stars;
      const bonus = stars * 40;
      Game.addXp(bonus);
      Game.finishZone(run.meta.id, { stars, score });

      const body = el('div');
      body.append(el('div.stars-big', null, UI.stars(stars, 5)));
      body.append(el('p.center', null,
        `${score} of ${max} marks  ·  +${bonus} XP bonus`,
        improved && prev.stars > 0 ? el('span', null, ' · new best!') : null
      ));

      if (stars >= 4) {
        body.append(el('p', { html: run.meta.praise || 'Zone secured. The next mission is open.' }));
      } else {
        body.append(el('p', { html: `<strong>Worth another run.</strong> ${run.meta.revise || ''}` }));
      }

      if (run.meta.recap) {
        const list = el('ul.tight');
        run.meta.recap.forEach(line => list.append(el('li', { html: line })));
        body.append(el('h3.mt', null, 'Remember'), list);
      }

      UI.modal('Mission debrief', body, [
        { label: 'Back to map', primary: true, onClick: () => { Game.go('map'); resolve(stars); } },
        { label: 'Run it again', onClick: () => { Game.go('zone', { id: run.meta.id }); resolve(stars); } }
      ]);
    });
  }

  return { zone, askAll, starsFor, debrief };
})();

</script>
<script>
/* ==========================================================================
   zone1.js — S1 Describing motion: "Beacon Run"
   The cadet flies a rescue drone between beacons and files a flight log.
   Task 1  Flight recorder — distance vs displacement, speed vs velocity.
   Task 2  Sign duel       — speeding up or slowing down, from the signs.
   Task 3  Flight check    — questions from the S1 bank.
   ========================================================================== */

const Zone1 = (() => {
  'use strict';
  const el = UI.el;
  const ACCENT = '#2fd6c3';

  const META = {
    id: 'z1',
    tag: 'Zone 1 · S1',
    name: 'Beacon Run',
    subtitle: 'Describing motion: position, displacement, speed, velocity, acceleration',
    accent: ACCENT,
    steps: 3,
    praise: 'Flight logs accepted. Navigation systems trust your readings.',
    revise: 'Re-read S1 steps 2–7: displacement is a change in position, and the sign of a tells you a direction, not "slowing down".',
    recap: [
      'Distance is the path length (scalar); displacement is the change in position (vector).',
      'Average speed = distance ÷ time.  Average velocity = displacement ÷ time.',
      'Same signs for v and a → speeding up.  Opposite signs → slowing down.',
      'A direction needs a reference: "32° west of north", not just "32°".'
    ]
  };

  /* ------------------------------ flight generation ---------------------- */

  const COMPASS = {
    N: { dx: 0, dy: 1, name: 'north' },
    S: { dx: 0, dy: -1, name: 'south' },
    E: { dx: 1, dy: 0, name: 'east' },
    W: { dx: -1, dy: 0, name: 'west' }
  };

  /** A 3-leg flight with a non-zero, non-degenerate net displacement. */
  function makeFlight() {
    for (let attempt = 0; attempt < 60; attempt++) {
      const pattern = Questions.pick([['N', 'W', 'S'], ['E', 'N', 'W'], ['N', 'E', 'S'], ['W', 'S', 'E'], ['E', 'S', 'W']]);
      const legs = pattern.map(dirKey => ({
        dir: dirKey,
        length: 10 * (2 + Math.floor(Math.random() * 11))   // 20–120 m
      }));
      let x = 0, y = 0, distance = 0;
      legs.forEach(leg => {
        x += COMPASS[leg.dir].dx * leg.length;
        y += COMPASS[leg.dir].dy * leg.length;
        distance += leg.length;
      });
      const displacement = Math.hypot(x, y);
      if (displacement < 25 || Math.abs(x) < 10 || Math.abs(y) < 10) continue;
      const time = 10 * (3 + Math.floor(Math.random() * 10));  // 30–120 s
      return { legs, x, y, distance, displacement, time };
    }
    // Fallback: the drone example from slide 23 of the content deck.
    return {
      legs: [{ dir: 'N', length: 120 }, { dir: 'W', length: 50 }, { dir: 'S', length: 40 }],
      x: -50, y: 80, distance: 210, displacement: Math.hypot(50, 80), time: 60
    };
  }

  /** Compass bearing of the net displacement, phrased the way the deck does. */
  function bearingText(x, y) {
    const ns = y >= 0 ? 'north' : 'south';
    const ew = x >= 0 ? 'east' : 'west';
    const angleFromNS = Physics.deg(Math.atan2(Math.abs(x), Math.abs(y)));
    return `${Physics.sig(angleFromNS, 2)}° ${ew} of ${ns}`;
  }

  /* ------------------------------ drawing -------------------------------- */

  function drawFlight(ctx, w, h, flight, progress) {
    const pad = 34;
    const pts = [{ x: 0, y: 0 }];
    let cx = 0, cy = 0;
    flight.legs.forEach(leg => {
      cx += COMPASS[leg.dir].dx * leg.length;
      cy += COMPASS[leg.dir].dy * leg.length;
      pts.push({ x: cx, y: cy });
    });

    const xs = pts.map(p => p.x), ys = pts.map(p => p.y);
    const minX = Math.min(...xs), maxX = Math.max(...xs);
    const minY = Math.min(...ys), maxY = Math.max(...ys);
    const spanX = Math.max(maxX - minX, 40), spanY = Math.max(maxY - minY, 40);
    const scale = Math.min((w - 2 * pad) / spanX, (h - 2 * pad) / spanY);
    const ox = pad + (w - 2 * pad - spanX * scale) / 2 - minX * scale;
    const oy = h - pad - (h - 2 * pad - spanY * scale) / 2 + minY * scale;
    const X = mx => ox + mx * scale;
    const Y = my => oy - my * scale;

    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = '#050a12';
    ctx.fillRect(0, 0, w, h);

    // Grid at 10 m spacing, so the scale is readable.
    ctx.strokeStyle = 'rgba(36,52,79,.8)';
    ctx.lineWidth = 1;
    for (let gx = Math.floor(minX / 10) * 10; gx <= maxX + 10; gx += 10) {
      ctx.beginPath(); ctx.moveTo(X(gx), 0); ctx.lineTo(X(gx), h); ctx.stroke();
    }
    for (let gy = Math.floor(minY / 10) * 10; gy <= maxY + 10; gy += 10) {
      ctx.beginPath(); ctx.moveTo(0, Y(gy)); ctx.lineTo(w, Y(gy)); ctx.stroke();
    }

    // Compass rose
    ctx.fillStyle = '#5f7190';
    ctx.font = '600 11px ui-monospace, monospace';
    ctx.fillText('N ↑', 10, 18);
    ctx.fillText('E →', 10, 32);
    ctx.fillText('10 m grid', 10, h - 10);

    // The route actually flown: this length is the DISTANCE.
    const totalLen = flight.distance;
    let walked = totalLen * progress;
    ctx.strokeStyle = ACCENT;
    ctx.lineWidth = 3;
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(X(0), Y(0));
    let head = { x: 0, y: 0 };
    for (let i = 1; i < pts.length; i++) {
      const segLen = Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y);
      if (walked >= segLen) {
        ctx.lineTo(X(pts[i].x), Y(pts[i].y));
        head = pts[i];
        walked -= segLen;
      } else {
        const f = segLen > 0 ? walked / segLen : 0;
        head = {
          x: pts[i - 1].x + (pts[i].x - pts[i - 1].x) * f,
          y: pts[i - 1].y + (pts[i].y - pts[i - 1].y) * f
        };
        ctx.lineTo(X(head.x), Y(head.y));
        walked = 0;
        break;
      }
    }
    ctx.stroke();

    // The straight start-to-finish arrow: this is the DISPLACEMENT.
    if (progress > 0.995) {
      ctx.strokeStyle = '#ffc24a';
      ctx.lineWidth = 2.5;
      ctx.setLineDash([7, 5]);
      ctx.beginPath();
      ctx.moveTo(X(0), Y(0));
      ctx.lineTo(X(flight.x), Y(flight.y));
      ctx.stroke();
      ctx.setLineDash([]);
      const ang = Math.atan2(Y(flight.y) - Y(0), X(flight.x) - X(0));
      ctx.fillStyle = '#ffc24a';
      ctx.beginPath();
      ctx.moveTo(X(flight.x), Y(flight.y));
      ctx.lineTo(X(flight.x) - 11 * Math.cos(ang - 0.4), Y(flight.y) - 11 * Math.sin(ang - 0.4));
      ctx.lineTo(X(flight.x) - 11 * Math.cos(ang + 0.4), Y(flight.y) - 11 * Math.sin(ang + 0.4));
      ctx.fill();
      ctx.font = '600 11px ui-monospace, monospace';
      ctx.fillText('displacement', X(flight.x / 2) + 8, Y(flight.y / 2) - 6);
    }

    // Beacons and drone
    pts.forEach((p, i) => {
      ctx.fillStyle = i === 0 ? '#5ce08a' : '#24344f';
      ctx.beginPath(); ctx.arc(X(p.x), Y(p.y), 5, 0, Math.PI * 2); ctx.fill();
    });
    ctx.fillStyle = '#e8eef8';
    ctx.beginPath(); ctx.arc(X(head.x), Y(head.y), 7, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = ACCENT;
    ctx.beginPath(); ctx.arc(X(head.x), Y(head.y), 3.5, 0, Math.PI * 2); ctx.fill();
  }

  /* ------------------------------ task 1 --------------------------------- */

  function flightRecorder(run) {
    return new Promise(resolve => {
      run.clear();
      run.setStep(0, 3);
      run.brief('Task 1 — <strong>Flight recorder.</strong> The drone flies its route, then mission control wants the log filled in. Watch the teal trail (the path it flew) and the gold arrow (start to finish).');

      const flight = makeFlight();
      const { cnv, ctx, w, h } = UI.canvas(540, 380);
      const legText = flight.legs.map(l => `${l.length} m ${COMPASS[l.dir].name}`).join(', then ');

      run.stage.append(
        el('div.canvas-wrap', null, cnv),
        el('div.panel.mt', null,
          el('div.eyebrow', null, 'Flight plan'),
          el('p.mb0', { html: `The drone flies <strong>${legText}</strong>. The flight takes <strong>${flight.time} s</strong>.` })
        )
      );

      let progress = 0;
      const anim = Zone.loop(dt => {
        progress = Math.min(1, progress + dt * 0.45);
        drawFlight(ctx, w, h, flight, progress);
      });

      const qs = [
        {
          type: 'num',
          stem: 'Log the <strong>distance</strong> travelled.',
          answer: flight.distance, unit: 'm', tol: 0.01,
          badge: 'pathfinder',
          hint: 'Add up the length of every leg.',
          work: `distance = ${flight.legs.map(l => l.length).join(' + ')} = ${flight.distance} m`
        },
        {
          type: 'num',
          stem: 'Log the <strong>magnitude of the displacement</strong>.',
          answer: flight.displacement, unit: 'm', tol: 0.02,
          badge: 'pathfinder',
          hint: 'Find the net movement east–west and north–south first, then use Pythagoras.',
          work: `net: ${Math.abs(flight.x)} m ${flight.x >= 0 ? 'east' : 'west'} and ${Math.abs(flight.y)} m ${flight.y >= 0 ? 'north' : 'south'}\n`
              + `s = √(${Math.abs(flight.x)}² + ${Math.abs(flight.y)}²) = ${Physics.sig(flight.displacement, 3)} m\n`
              + `direction: ${bearingText(flight.x, flight.y)}`
        },
        {
          type: 'num',
          stem: 'Log the <strong>average speed</strong>.',
          answer: flight.distance / flight.time, unit: 'm s⁻¹', tol: 0.02,
          work: `average speed = distance ÷ time = ${flight.distance} ÷ ${flight.time} = ${Physics.sig(flight.distance / flight.time, 3)} m s⁻¹`
        },
        {
          type: 'num',
          stem: 'Log the <strong>magnitude of the average velocity</strong>.',
          answer: flight.displacement / flight.time, unit: 'm s⁻¹', tol: 0.02,
          work: `average velocity = displacement ÷ time = ${Physics.sig(flight.displacement, 3)} ÷ ${flight.time}\n`
              + `= ${Physics.sig(flight.displacement / flight.time, 3)} m s⁻¹ at ${bearingText(flight.x, flight.y)}`
        }
      ];

      Shell.askAll(run.side, qs, { title: 'Flight log', xp: 30 }).then(correct => {
        anim.stop();
        run.award(correct, qs.length);
        resolve();
      });
    });
  }

  /* ------------------------------ task 2 --------------------------------- */

  /** Quick-fire: given the signs of v and a, is the craft speeding up? */
  function signDuel(run) {
    return new Promise(resolve => {
      run.clear();
      run.setStep(1, 3);
      run.brief('Task 2 — <strong>Sign duel.</strong> Take <strong>right as positive</strong>. The thruster reading gives the acceleration. Call it before the timer runs out: is the craft speeding up or slowing down?');

      const ROUNDS = 8;
      const TIME_LIMIT = 6;
      let round = 0, correct = 0, timeLeft = TIME_LIMIT, locked = false;

      const { cnv, ctx, w, h } = UI.canvas(540, 300);
      const timerBar = el('div.hud__xpbar', { style: { height: '10px' } }, el('div.hud__xpfill', { style: { width: '100%', transition: 'none' } }));
      const scoreLine = el('p.small.muted.mb0');
      run.stage.append(el('div.canvas-wrap', null, cnv), el('div.mt', null, timerBar), el('div.mt', null, scoreLine));

      let current = null;
      const feedback = el('div');
      const btnUp = el('button.btn.btn--wide', { type: 'button', onClick: () => answer(true) }, '⏩ Speeding up');
      const btnDown = el('button.btn.btn--wide', { type: 'button', onClick: () => answer(false) }, '⏪ Slowing down');
      run.side.append(el('div.panel', null,
        el('div.eyebrow', null, 'Call it'),
        el('p.small.muted', null, 'Rule from S1 step 7: same signs → speeding up; opposite signs → slowing down.'),
        el('div.btn-row', null, btnUp, btnDown),
        feedback
      ));

      function newRound() {
        const v = (Math.random() < 0.5 ? -1 : 1) * (2 + Math.floor(Math.random() * 12));
        const a = (Math.random() < 0.5 ? -1 : 1) * (0.5 + Math.floor(Math.random() * 8) * 0.5);
        current = { v, a, speedingUp: v * a > 0 };
        timeLeft = TIME_LIMIT;
        locked = false;
        btnUp.disabled = btnDown.disabled = false;
        feedback.innerHTML = '';
        scoreLine.textContent = `Round ${round + 1} of ${ROUNDS} — ${correct} correct`;
      }

      function answer(saidSpeedingUp) {
        if (locked || !current) return;
        locked = true;
        btnUp.disabled = btnDown.disabled = true;
        const ok = saidSpeedingUp === current.speedingUp;
        if (ok) { correct++; Game.addXp(20); }
        Game.recordAnswer(ok);
        if (ok && correct >= 6) Game.awardBadge('signmaster');

        const vs = current.v > 0 ? 'positive' : 'negative';
        const as = current.a > 0 ? 'positive' : 'negative';
        feedback.innerHTML = '';
        feedback.append(el('div.feedback' + (ok ? '.feedback--right' : '.feedback--wrong'), null,
          el('div.feedback__title', null, ok ? '✓ Correct' : '✗ Not quite'),
          el('div', { html: `v is ${vs} and a is ${as} — <strong>${vs === as ? 'same' : 'opposite'} signs</strong>, so the craft is <strong>${current.speedingUp ? 'speeding up' : 'slowing down'}</strong>.` })
        ));

        setTimeout(() => {
          round++;
          if (round >= ROUNDS) {
            anim.stop();
            run.award(correct, ROUNDS);
            resolve();
          } else {
            newRound();
          }
        }, 1500);
      }

      function draw() {
        ctx.clearRect(0, 0, w, h);
        ctx.fillStyle = '#050a12';
        ctx.fillRect(0, 0, w, h);
        if (!current) return;

        const midY = h / 2;
        // Axis with the positive direction spelled out.
        ctx.strokeStyle = '#24344f';
        ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.moveTo(30, midY + 46); ctx.lineTo(w - 30, midY + 46); ctx.stroke();
        ctx.fillStyle = '#5f7190';
        ctx.font = '600 12px ui-monospace, monospace';
        ctx.fillText('− negative', 34, midY + 66);
        ctx.fillText('positive +', w - 106, midY + 66);

        // Craft
        const cx = w / 2;
        ctx.fillStyle = '#e8eef8';
        ctx.beginPath();
        ctx.moveTo(cx + (current.v > 0 ? 26 : -26), midY);
        ctx.lineTo(cx - (current.v > 0 ? 18 : -18), midY - 13);
        ctx.lineTo(cx - (current.v > 0 ? 18 : -18), midY + 13);
        ctx.closePath(); ctx.fill();

        // Velocity arrow (teal) sized by |v|
        arrow(ctx, cx, midY - 46, Math.sign(current.v) * (34 + Math.abs(current.v) * 7), ACCENT, `v = ${current.v > 0 ? '+' : ''}${current.v} m s⁻¹`);
        // Acceleration arrow (gold) sized by |a|
        arrow(ctx, cx, midY + 100, Math.sign(current.a) * (34 + Math.abs(current.a) * 14), '#ffc24a', `a = ${current.a > 0 ? '+' : ''}${current.a.toFixed(1)} m s⁻²`);
      }

      function arrow(c, x, y, len, colour, label) {
        c.strokeStyle = colour; c.fillStyle = colour; c.lineWidth = 4;
        c.beginPath(); c.moveTo(x, y); c.lineTo(x + len, y); c.stroke();
        const s = Math.sign(len);
        c.beginPath();
        c.moveTo(x + len, y);
        c.lineTo(x + len - s * 13, y - 8);
        c.lineTo(x + len - s * 13, y + 8);
        c.fill();
        c.font = '700 13px ui-monospace, monospace';
        c.fillText(label, x - 60, y - 16);
      }

      newRound();
      const anim = Zone.loop(dt => {
        if (!locked) {
          timeLeft -= dt;
          if (timeLeft <= 0) { answer(!current.speedingUp); }  // time out counts as wrong
        }
        timerBar.firstChild.style.width = `${Math.max(0, (timeLeft / TIME_LIMIT) * 100)}%`;
        timerBar.firstChild.style.background = timeLeft < 2 ? '#ff6b81' : 'linear-gradient(90deg,#17806f,#2fd6c3)';
        draw();
      });
    });
  }

  /* ------------------------------ zone entry ----------------------------- */

  async function render(root) {
    const run = Shell.zone(root, META);
    await flightRecorder(run);
    await signDuel(run);

    run.clear();
    run.setStep(2, 3);
    run.brief('Task 3 — <strong>Flight check.</strong> Mission control asks the questions that decide whether you keep your licence.');
    run.stage.append(el('div.panel', null,
      el('div.eyebrow', null, 'S1 key ideas'),
      el('ul.tight', { html: `
        <li>Position needs an <strong>origin</strong> and a <strong>positive direction</strong>.</li>
        <li>Displacement = final position − initial position.</li>
        <li>Speed uses distance; velocity uses displacement and needs a direction.</li>
        <li>A speedometer shows an <strong>instantaneous speed</strong>.</li>
        <li>Constant speed round a bend is still <strong>accelerating</strong>.</li>` })
    ));

    const qs = Questions.sample(Questions.banks.s1, 4);
    const correct = await Shell.askAll(run.side, qs, { title: 'Licence check', xp: 30 });
    run.award(correct, qs.length);
    run.setStep(3, 3);
    await run.finish();
  }

  return { META, render };
})();

</script>
<script>
/* ==========================================================================
   zone2.js — S2 Motion graphs: "Docking Sequence"
   The cadet does not answer questions about a graph — the cadet *builds* the
   graph, and the ship flies whatever they draw.
     area under v–t = displacement,  gradient of v–t = acceleration.
   Task 1  Docking   — shape a three-phase v–t profile to hit a dock exactly.
   Task 2  Telemetry — read gradients and areas off a graph the ship flew.
   Task 3  Flight check.
   ========================================================================== */

const Zone2 = (() => {
  'use strict';
  const el = UI.el;
  const ACCENT = '#a98bff';

  const META = {
    id: 'z2',
    tag: 'Zone 2 · S2',
    name: 'Docking Sequence',
    subtitle: 'Motion graphs: gradients give rates, areas give changes',
    accent: ACCENT,
    steps: 3,
    praise: 'Docking clamps engaged. You can read a graph and fly one.',
    revise: 'Re-read S2 steps 1–6: gradient of v–t is acceleration, area under v–t is displacement, and area below the axis is negative.',
    recap: [
      'Gradient of s–t = velocity; use a <strong>tangent</strong> for an instantaneous value.',
      'Gradient of v–t = acceleration.  Area under v–t = displacement.',
      'Area under a–t = <strong>change</strong> in velocity, so add u to get v.',
      'Area below the time axis counts as negative displacement.'
    ]
  };

  /* ------------------------------ graph drawing -------------------------- */

  /**
   * Draw a velocity–time graph.  points = [{t, v}, ...].
   * opts: { tMax, vMin, vMax, shade, title, marker:{t,v} }
   */
  function drawVT(ctx, w, h, points, opts) {
    const o = opts || {};
    const pad = { l: 52, r: 16, t: 22, b: 36 };
    const tMax = o.tMax || Math.max(1, points[points.length - 1].t);
    const vMax = o.vMax !== undefined ? o.vMax : Math.max(1, ...points.map(p => p.v)) * 1.15;
    const vMin = o.vMin !== undefined ? o.vMin : Math.min(0, ...points.map(p => p.v)) * 1.15;
    const X = t => pad.l + (t / tMax) * (w - pad.l - pad.r);
    const Y = v => h - pad.b - ((v - vMin) / (vMax - vMin)) * (h - pad.t - pad.b);

    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = '#050a12';
    ctx.fillRect(0, 0, w, h);

    // Gridlines
    const tStep = niceStep(tMax), vStep = niceStep(vMax - vMin);
    ctx.strokeStyle = 'rgba(36,52,79,.9)';
    ctx.fillStyle = '#5f7190';
    ctx.font = '11px ui-monospace, monospace';
    ctx.lineWidth = 1;
    for (let t = 0; t <= tMax + 1e-9; t += tStep) {
      ctx.beginPath(); ctx.moveTo(X(t), pad.t); ctx.lineTo(X(t), h - pad.b); ctx.stroke();
      ctx.fillText(String(+t.toFixed(2)), X(t) - 8, h - pad.b + 15);
    }
    for (let v = Math.ceil(vMin / vStep) * vStep; v <= vMax + 1e-9; v += vStep) {
      ctx.beginPath(); ctx.moveTo(pad.l, Y(v)); ctx.lineTo(w - pad.r, Y(v)); ctx.stroke();
      ctx.fillText(String(+v.toFixed(2)), 8, Y(v) + 4);
    }

    // Shaded area under the curve: teal above the axis, rose below.
    if (o.shade !== false) {
      for (let i = 1; i < points.length; i++) {
        const a = points[i - 1], b = points[i];
        const negative = (a.v + b.v) / 2 < 0;
        ctx.fillStyle = negative ? 'rgba(255,107,129,.20)' : 'rgba(47,214,195,.16)';
        ctx.beginPath();
        ctx.moveTo(X(a.t), Y(0));
        ctx.lineTo(X(a.t), Y(a.v));
        ctx.lineTo(X(b.t), Y(b.v));
        ctx.lineTo(X(b.t), Y(0));
        ctx.closePath();
        ctx.fill();
      }
    }

    // Axes
    ctx.strokeStyle = '#93a4c0';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(pad.l, pad.t); ctx.lineTo(pad.l, h - pad.b); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(pad.l, Y(0)); ctx.lineTo(w - pad.r, Y(0)); ctx.stroke();

    // The line itself
    ctx.strokeStyle = o.colour || ACCENT;
    ctx.lineWidth = 3;
    ctx.lineJoin = 'round';
    ctx.beginPath();
    points.forEach((p, i) => (i ? ctx.lineTo(X(p.t), Y(p.v)) : ctx.moveTo(X(p.t), Y(p.v))));
    ctx.stroke();

    if (o.marker) {
      ctx.fillStyle = '#ffc24a';
      ctx.beginPath(); ctx.arc(X(o.marker.t), Y(o.marker.v), 6, 0, Math.PI * 2); ctx.fill();
    }

    ctx.fillStyle = '#93a4c0';
    ctx.font = '600 11px ui-monospace, monospace';
    ctx.fillText('v / m s⁻¹', 8, 14);
    ctx.fillText('t / s', w - pad.r - 26, h - 8);
    return { X, Y };
  }

  function niceStep(span) {
    const raw = span / 6;
    const pow = Math.pow(10, Math.floor(Math.log10(raw || 1)));
    const n = raw / pow;
    return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 5 ? 5 : 10) * pow;
  }

  /* ------------------------------ task 1: docking ------------------------ */

  const LEVELS = [
    { target: 120, aMax: 3.0, tMax: 30, vCap: 14, dockSpeed: 0.0, note: 'Routine approach to Beacon Station.' },
    { target: 250, aMax: 2.0, tMax: 42, vCap: 16, dockSpeed: 0.0, note: 'Heavier load: the hull will not take more than 2.0 m s⁻².' },
    { target: 400, aMax: 2.5, tMax: 45, vCap: 20, dockSpeed: 0.0, note: 'Long run, tight clock. Cruise pays for itself.' }
  ];

  function docking(run) {
    return new Promise(resolve => {
      run.clear();
      run.setStep(0, 3);
      run.brief('Task 1 — <strong>Docking sequence.</strong> Shape the ship\'s velocity–time graph so that the <strong>area under it</strong> equals the distance to the dock, and so the ship arrives at rest. The <strong>gradient</strong> of each sloping part is the acceleration — go over the hull limit and the clamps shear off.');

      let level = 0, marks = 0;

      const { cnv, ctx, w, h } = UI.canvas(540, 300);
      const shipCanvas = UI.canvas(540, 110);
      run.stage.append(
        el('div.canvas-wrap', null, cnv),
        el('div.canvas-wrap.mt', null, shipCanvas.cnv)
      );
      const readouts = UI.readout({
        area:  { label: 'Area = s' },
        a1:    { label: 'Gradient a₁' },
        a3:    { label: 'Gradient a₃' },
        time:  { label: 'Total time' }
      });
      run.stage.append(readouts.wrap);

      const panel = el('div.panel');
      run.side.append(panel);

      let sliders, flying = null, status;

      function profile() {
        const v = sliders.v.value, t1 = sliders.t1.value, t2 = sliders.t2.value, t3 = sliders.t3.value;
        return [
          { t: 0, v: 0 },
          { t: t1, v },
          { t: t1 + t2, v },
          { t: t1 + t2 + t3, v: 0 }
        ];
      }

      function analyse() {
        const pts = profile();
        const v = sliders.v.value, t1 = sliders.t1.value, t3 = sliders.t3.value;
        const total = pts[3].t;
        return {
          pts,
          displacement: Physics.areaUnder(pts),
          a1: t1 > 0 ? v / t1 : (v > 0 ? Infinity : 0),
          a3: t3 > 0 ? -v / t3 : (v > 0 ? -Infinity : 0),
          totalTime: total
        };
      }

      function refresh() {
        const L = LEVELS[level];
        const a = analyse();
        readouts.set('area', `${Physics.sig(a.displacement, 4)} m`);
        readouts.set('a1', isFinite(a.a1) ? `${Physics.fix(a.a1, 2)} m s⁻²` : '∞');
        readouts.set('a3', isFinite(a.a3) ? `${Physics.fix(a.a3, 2)} m s⁻²` : '−∞');
        readouts.set('time', `${Physics.fix(a.totalTime, 1)} s`);

        const missBy = a.displacement - L.target;
        const okDist = Math.abs(missBy) <= Math.max(2, L.target * 0.01);
        const okAcc = Math.abs(a.a1) <= L.aMax + 1e-9 && Math.abs(a.a3) <= L.aMax + 1e-9;
        const okTime = a.totalTime <= L.tMax + 1e-9;

        status.innerHTML = '';
        status.append(
          chip(`distance ${okDist ? '✓' : (missBy > 0 ? `${Physics.sig(missBy, 2)} m long` : `${Physics.sig(-missBy, 2)} m short`)}`, okDist),
          chip(`a ≤ ${L.aMax} m s⁻² ${okAcc ? '✓' : '✗'}`, okAcc),
          chip(`t ≤ ${L.tMax} s ${okTime ? '✓' : '✗'}`, okTime)
        );
        launchBtn.disabled = !!flying;
        drawVT(ctx, w, h, a.pts, { tMax: L.tMax, vMax: L.vCap * 1.1, vMin: 0, colour: ACCENT });
        if (!flying) drawShip(0, 0);
        return { a, okDist, okAcc, okTime, ok: okDist && okAcc && okTime };
      }

      function chip(text, on) {
        return el('span.chip' + (on ? '.chip--on' : ''), null, text);
      }

      function drawShip(x, v) {
        const L = LEVELS[level];
        const c = shipCanvas.ctx, W = shipCanvas.w, H = shipCanvas.h;
        c.clearRect(0, 0, W, H);
        c.fillStyle = '#050a12'; c.fillRect(0, 0, W, H);

        const trackY = H / 2 + 6;
        const left = 40, right = W - 60;
        const px = left + Math.max(0, Math.min(1.15, x / L.target)) * (right - left);

        // Dock
        c.strokeStyle = '#24344f'; c.lineWidth = 2;
        c.beginPath(); c.moveTo(left, trackY); c.lineTo(right, trackY); c.stroke();
        c.fillStyle = '#ffc24a';
        c.fillRect(right - 3, trackY - 22, 6, 44);
        c.font = '600 11px ui-monospace, monospace';
        c.fillText('DOCK', right - 16, trackY - 30);
        c.fillStyle = '#5f7190';
        c.fillText(`${L.target} m`, left, trackY + 34);

        // Ship
        c.fillStyle = Math.abs(x - L.target) < 2 ? '#5ce08a' : '#e8eef8';
        c.beginPath();
        c.moveTo(px + 15, trackY);
        c.lineTo(px - 11, trackY - 9);
        c.lineTo(px - 11, trackY + 9);
        c.closePath(); c.fill();
        if (v > 0.2) {                      // exhaust plume while thrusting
          c.fillStyle = 'rgba(47,214,195,.7)';
          c.beginPath();
          c.moveTo(px - 11, trackY - 4);
          c.lineTo(px - 11 - Math.min(22, v * 1.6), trackY);
          c.lineTo(px - 11, trackY + 4);
          c.closePath(); c.fill();
        }
        c.fillStyle = '#93a4c0';
        c.font = '600 11px ui-monospace, monospace';
        c.fillText(`x = ${Physics.fix(x, 1)} m   v = ${Physics.fix(v, 1)} m s⁻¹`, left, 18);
      }

      /** Fly the profile the player drew, integrating it exactly. */
      function launch() {
        const L = LEVELS[level];
        const check = refresh();
        const a = check.a;
        if (flying) return;

        flying = { t: 0 };
        launchBtn.disabled = true;
        const anim = Zone.loop(dt => {
          flying.t += dt * 1.6;
          const t = Math.min(flying.t, a.totalTime);
          const vNow = velocityAt(a, t);
          const xNow = Physics.areaUnder(clipProfile(a.pts, t));
          drawVT(ctx, w, h, a.pts, { tMax: L.tMax, vMax: L.vCap * 1.1, vMin: 0, colour: ACCENT, marker: { t, v: vNow } });
          drawShip(xNow, vNow);
          if (t >= a.totalTime) {
            anim.stop();
            flying = null;
            settle(check, xNow);
          }
        });
      }

      function settle(check, finalX) {
        const L = LEVELS[level];
        const err = finalX - L.target;
        if (check.ok) {
          marks++;
          Game.addXp(90);
          Game.awardBadge('areahunter');
          UI.modal('Docked ✓', el('div', null,
            el('p', { html: `Clamps engaged with <strong>${Physics.sig(Math.abs(err), 2)} m</strong> to spare.` }),
            el('p.small.muted', { html: `The area under your graph was ${Physics.sig(check.a.displacement, 4)} m — that area <em>is</em> the displacement. Your gradients were ${Physics.fix(check.a.a1, 2)} and ${Physics.fix(check.a.a3, 2)} m s⁻², both inside the ${L.aMax} m s⁻² hull limit.` })
          ), [{ label: level < LEVELS.length - 1 ? 'Next approach ▶' : 'Finish task ▶', primary: true, onClick: nextLevel }]);
        } else {
          const reasons = [];
          if (!check.okDist) reasons.push(err > 0 ? `you overshot by ${Physics.sig(err, 2)} m — the area under your graph is too big` : `you stopped ${Physics.sig(-err, 2)} m short — the area under your graph is too small`);
          if (!check.okAcc) reasons.push(`a gradient exceeded ${L.aMax} m s⁻² — make that sloping section last longer`);
          if (!check.okTime) reasons.push(`the run took ${Physics.fix(check.a.totalTime, 1)} s, over the ${L.tMax} s limit`);
          UI.modal('Approach aborted', el('div', null,
            el('p', { html: `Because ${reasons.join(', and ')}.` }),
